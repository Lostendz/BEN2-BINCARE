<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ตรวจสอบสถานะ | BINCARE</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* =====================================================
   COLOR THEME
   น้ำเงิน - เหลือง แบบนุ่ม
===================================================== */

:root {

    --blue: #4A78A8;
    --blue-dark: #3E6792;
    --blue-light: #EAF2F9;

    --yellow: #F4C95D;
    --yellow-light: #FFF7DD;

    --green: #5FA777;
    --green-light: #EAF6EE;

    --red: #D96B6B;
    --red-light: #FDECEC;

    --text: #263445;
    --text-light: #6B7280;

    --background: #F5F7FA;
    --white: #FFFFFF;
    --border: #E1E7EF;

}


/* =====================================================
   BODY
===================================================== */

body {

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            180deg,
            #EEF4FA 0%,
            #F5F7FA 35%,
            #F5F7FA 100%
        );

    color: var(--text);

    min-height: 100vh;

}


/* =====================================================
   HEADER
===================================================== */

header {

    background: var(--blue);

    color: white;

    padding: 20px;

    box-shadow:
        0 3px 12px rgba(60, 90, 120, .12);

}


.logo {

    font-size: 27px;

    font-weight: bold;

    letter-spacing: .5px;

}


.header-subtitle {

    margin-top: 4px;

    font-size: 15px;

    opacity: .95;

}


/* =====================================================
   CONTAINER
===================================================== */

.container {

    max-width: 700px;

    margin: auto;

    padding: 25px 18px 40px;

}


/* =====================================================
   BACK
===================================================== */

.back {

    display: inline-block;

    margin-bottom: 15px;

    color: var(--blue);

    text-decoration: none;

    font-weight: bold;

}


.back:hover {

    color: var(--blue-dark);

}


/* =====================================================
   MAIN CARD
===================================================== */

.card {

    background: var(--white);

    border-radius: 22px;

    padding: 28px;

    box-shadow:
        0 5px 20px rgba(50, 70, 90, .08);

    border: 1px solid rgba(225, 231, 239, .8);

}


/* =====================================================
   TITLE
===================================================== */

h1 {

    margin-bottom: 9px;

    font-size: 27px;

}


.subtitle {

    color: var(--text-light);

    margin-bottom: 25px;

    line-height: 1.6;

}


/* =====================================================
   SEARCH
===================================================== */

.search-box {

    display: flex;

    gap: 10px;

}


input {

    flex: 1;

    padding: 14px;

    border:
        1px solid var(--border);

    border-radius: 11px;

    font-size: 16px;

    outline: none;

    color: var(--text);

    background: #FCFDFE;

    transition: .2s;

}


input:focus {

    border-color: var(--blue);

    box-shadow:
        0 0 0 3px rgba(74, 120, 168, .12);

    background: white;

}


input::placeholder {

    color: #9CA3AF;

}


/* =====================================================
   SEARCH BUTTON
===================================================== */

button {

    border: none;

    background: var(--blue);

    color: white;

    padding: 14px 20px;

    border-radius: 11px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;

}


button:hover {

    background: var(--blue-dark);

    transform: translateY(-1px);

}


button:active {

    transform: translateY(0);

}


button:disabled {

    background: #AAB6C4;

    cursor: not-allowed;

    transform: none;

}


/* =====================================================
   HINT
===================================================== */

.hint {

    margin-top: 15px;

    padding: 13px 15px;

    border-radius: 11px;

    background: var(--yellow-light);

    color: #80651D;

    font-size: 14px;

    line-height: 1.6;

    border-left:
        4px solid var(--yellow);

}


/* =====================================================
   LOADING
===================================================== */

.loading {

    display: none;

    margin-top: 22px;

    text-align: center;

    color: var(--text-light);

    padding: 10px;

}


/* =====================================================
   NOT FOUND
===================================================== */

.not-found {

    display: none;

    margin-top: 25px;

    padding: 18px;

    border-radius: 12px;

    background: var(--red-light);

    color: #9B4545;

    line-height: 1.6;

}


/* =====================================================
   RESULT
===================================================== */

.result {

    display: none;

    margin-top: 25px;

    border-top:
        1px solid var(--border);

    padding-top: 25px;

}


.result.show {

    display: block;

}


/* =====================================================
   RESULT CARD
===================================================== */

.result-card {

    border:
        1px solid var(--border);

    border-radius: 16px;

    padding: 21px;

    background: #FCFDFE;

}


/* =====================================================
   TYPE
===================================================== */

.type {

    display: inline-block;

    background: var(--blue-light);

    color: var(--blue-dark);

    padding: 7px 13px;

    border-radius: 20px;

    font-weight: bold;

    margin-bottom: 12px;

}


/* =====================================================
   TICKET
===================================================== */

.ticket {

    font-size: 22px;

    font-weight: bold;

    color: var(--blue-dark);

    margin-bottom: 17px;

    word-break: break-word;

}


/* =====================================================
   INFO
===================================================== */

.info {

    margin: 11px 0;

    line-height: 1.6;

    color: var(--text);

}


/* =====================================================
   STATUS
===================================================== */

.status {

    display: inline-block;

    margin-top: 15px;

    padding: 9px 15px;

    border-radius: 20px;

    font-weight: bold;

}


/* รอตรวจสอบ */

.pending {

    background: var(--yellow-light);

    color: #80651D;

}


/* กำลังดำเนินการ */

.in_progress {

    background: var(--blue-light);

    color: var(--blue-dark);

}


/* ดำเนินการแล้ว */

.resolved {

    background: var(--green-light);

    color: #39764E;

}


/* เจ้าของรับแล้ว */

.claimed {

    background: var(--green-light);

    color: #39764E;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:600px) {

    .container {

        padding:
            20px 14px 35px;

    }


    .card {

        padding: 22px 18px;

        border-radius: 18px;

    }


    h1 {

        font-size: 23px;

    }


    .search-box {

        flex-direction: column;

    }


    button {

        width: 100%;

    }


    .ticket {

        font-size: 19px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

<div class="logo">
BINCARE
</div>

<div class="header-subtitle">
🔎 ระบบตรวจสอบสถานะ
</div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="container">


<a
href="index.html"
class="back">

← กลับหน้าหลัก

</a>


<div class="card">


<h1>
🔎 ตรวจสอบสถานะรายการ
</h1>


<p class="subtitle">

กรอกหมายเลขรายการที่ได้รับหลังจาก
แจ้งปัญหา หรือแจ้งของหาย / พบของ

</p>


<!-- =================================================
     SEARCH
================================================= -->

<div class="search-box">


<input
id="ticketInput"
type="text"
placeholder="เช่น LOST-745003 หรือ REPORT-123456"
autocomplete="off"
>


<button
id="searchButton"
onclick="searchTicket()">

🔍 ตรวจสอบ

</button>


</div>


<!-- =================================================
     HINT
================================================= -->

<div class="hint">

💡 ตัวอย่างหมายเลขรายการ:
<strong>LOST-345018</strong>
หรือ
<strong>REPORT-123456</strong>

</div>


<!-- =================================================
     LOADING
================================================= -->

<div
id="loading"
class="loading">

กำลังค้นหาข้อมูล...

</div>


<!-- =================================================
     NOT FOUND
================================================= -->

<div
id="notFound"
class="not-found">

❌ ไม่พบหมายเลขรายการนี้
<br>
กรุณาตรวจสอบหมายเลขอีกครั้ง

</div>


<!-- =================================================
     RESULT
================================================= -->

<div
id="result"
class="result">


<div class="result-card">


<div
id="type"
class="type">
</div>


<div
id="ticket"
class="ticket">
</div>


<div id="details">
</div>


<div id="status">
</div>


</div>

</div>


</div>

</div>


<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://pbjeyvupzbhxodlibjuh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_paiTf1uzpiCAPR1oWQMlDg_PfVzT2p6";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   SEARCH
===================================================== */

async function searchTicket() {


    const input =
        document.getElementById(
            "ticketInput"
        );


    const button =
        document.getElementById(
            "searchButton"
        );


    const ticket =
        input.value
            .trim()
            .toUpperCase();


    const result =
        document.getElementById(
            "result"
        );


    const notFound =
        document.getElementById(
            "notFound"
        );


    const loading =
        document.getElementById(
            "loading"
        );


    /* ซ่อนผลเดิม */

    result.classList.remove(
        "show"
    );


    notFound.style.display =
        "none";


    /* ตรวจสอบช่องว่าง */

    if (!ticket) {


        notFound.innerHTML =
            "⚠️ กรุณากรอกหมายเลขรายการ";


        notFound.style.display =
            "block";


        input.focus();


        return;

    }


    /* เริ่มค้นหา */

    loading.style.display =
        "block";


    button.disabled =
        true;


    button.textContent =
        "กำลังค้นหา...";


    try {


        /* =================================================
           ค้นหา REPORTS
        ================================================= */

        const {
            data: reports,
            error: reportError
        } =
        await supabaseClient

            .from("reports")

            .select("*")

            .eq(
                "ticket_number",
                ticket
            )

            .limit(1);


        if (reportError) {

            console.error(
                "Report Error:",
                reportError
            );

        }


        if (
            reports &&
            reports.length > 0
        ) {


            showReport(
                reports[0]
            );


            return;

        }


        /* =================================================
           ค้นหา LOST FOUND
        ================================================= */

        const {
            data: lostFound,
            error: lostError
        } =
        await supabaseClient

            .from("lost_found")

            .select("*")

            .eq(
                "ticket_number",
                ticket
            )

            .limit(1);


        if (lostError) {

            console.error(
                "Lost Found Error:",
                lostError
            );

        }


        if (
            lostFound &&
            lostFound.length > 0
        ) {


            showLostFound(
                lostFound[0]
            );


            return;

        }


        /* =================================================
           ไม่พบข้อมูล
        ================================================= */

        notFound.innerHTML = `

            ❌ ไม่พบหมายเลขรายการนี้

            <br>

            กรุณาตรวจสอบหมายเลขอีกครั้ง

        `;


        notFound.style.display =
            "block";


    }

    catch (error) {


        console.error(
            error
        );


        notFound.innerHTML = `

            ❌ เกิดข้อผิดพลาดในการค้นหา

            <br>

            กรุณาลองใหม่อีกครั้ง

        `;


        notFound.style.display =
            "block";

    }


    finally {


        loading.style.display =
            "none";


        button.disabled =
            false;


        button.textContent =
            "🔍 ตรวจสอบ";

    }

}


/* =====================================================
   SHOW REPORT
===================================================== */

function showReport(report) {


    document
        .getElementById("type")
        .textContent =
            "🚨 แจ้งปัญหา";


    document
        .getElementById("ticket")
        .textContent =
            report.ticket_number;


    document
        .getElementById("details")
        .innerHTML = `

        <div class="info">

            📌 <b>หัวข้อ:</b>

            ${escapeHtml(
                report.title
            )}

        </div>


        <div class="info">

            📂 <b>ประเภท:</b>

            ${escapeHtml(
                report.category
            )}

        </div>


        <div class="info">

            📍 <b>สถานที่:</b>

            ${escapeHtml(
                report.location
            )}

        </div>


        <div class="info">

            📝 <b>รายละเอียด:</b>

            <br>

            ${escapeHtml(
                report.description || "-"
            )}

        </div>

    `;


    showStatus(
        report.status
    );

}


/* =====================================================
   SHOW LOST / FOUND
===================================================== */

function showLostFound(item) {


    const isLost =
        item.type === "ของหาย";


    document
        .getElementById("type")
        .textContent =

        isLost
        ? "🔴 ของหาย"
        : "🟢 พบของ";


    document
        .getElementById("ticket")
        .textContent =
            item.ticket_number;


    document
        .getElementById("details")
        .innerHTML = `

        <div class="info">

            📦 <b>สิ่งของ:</b>

            ${escapeHtml(
                item.item
            )}

        </div>


        <div class="info">

            📍 <b>สถานที่:</b>

            ${escapeHtml(
                item.location
            )}

        </div>


        <div class="info">

            📝 <b>รายละเอียด:</b>

            <br>

            ${escapeHtml(
                item.description || "-"
            )}

        </div>

    `;


    /* =================================================
       ถ้าเจ้าของรับของแล้ว
    ================================================= */

    if (
        item.is_claimed === true
    ) {


        showClaimedStatus();


        return;

    }


    showStatus(
        item.status
    );

}


/* =====================================================
   SHOW STATUS
===================================================== */

function showStatus(status) {


    const statusElement =
        document.getElementById(
            "status"
        );


    const statusClass =
        status || "pending";


    const statusText = {


        pending:
            "🟡 รอตรวจสอบ",


        in_progress:
            "🔵 กำลังดำเนินการ",


        resolved:
            "🟢 ดำเนินการเรียบร้อย"

    };


    statusElement.className =
        "status " +
        statusClass;


    statusElement.textContent =

        statusText[statusClass] ||

        "📌 " +
        statusClass;


    document
        .getElementById(
            "result"
        )
        .classList.add(
            "show"
        );

}


/* =====================================================
   CLAIMED
===================================================== */

function showClaimedStatus() {


    const statusElement =
        document.getElementById(
            "status"
        );


    statusElement.className =
        "status claimed";


    statusElement.textContent =
        "✅ เจ้าของมารับของแล้ว";


    document
        .getElementById(
            "result"
        )
        .classList.add(
            "show"
        );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {


    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   ENTER TO SEARCH
===================================================== */

document
    .getElementById(
        "ticketInput"
    )
    .addEventListener(
        "keydown",
        function(event) {


            if (
                event.key === "Enter"
            ) {

                searchTicket();

            }

        }
    );

</script>


</body>

</html>
