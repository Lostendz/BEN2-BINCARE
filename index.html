<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* =====================================================
   THEME
===================================================== */

:root {

    --green: #16a34a;
    --green-dark: #166534;
    --green-light: #ecfdf5;

    --yellow: #eab308;
    --yellow-light: #fef9c3;

    --text: #1f2937;
    --muted: #6b7280;

    --bg: #f4f7f5;
    --white: #ffffff;

    --border: #d1d5db;

}


/* =====================================================
   BODY
===================================================== */

body {

    font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

    background: var(--bg);

    color: var(--text);

    min-height: 100vh;

}


/* =====================================================
   HEADER
===================================================== */

header {

    background:
        linear-gradient(
            135deg,
            #166534,
            #16a34a
        );

    color: white;

    padding: 18px 20px;

    box-shadow:
        0 3px 15px rgba(22,101,52,.15);

}


.header-inner {

    max-width: 1100px;

    margin: auto;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

}


.brand {

    display: flex;

    align-items: center;

    gap: 12px;

}


.logo-box {

    width: 48px;
    height: 48px;

    background: #fef9c3;

    color: var(--green-dark);

    border-radius: 14px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 25px;

}


.logo {

    font-size: 26px;

    font-weight: bold;

    letter-spacing: .5px;

}


.subtitle {

    font-size: 14px;

    opacity: .9;

    margin-top: 3px;

}


.admin-button {

    text-decoration: none;

    color: var(--green-dark);

    background: white;

    padding: 10px 15px;

    border-radius: 10px;

    font-weight: bold;

    font-size: 14px;

    transition: .2s;

}


.admin-button:hover {

    background: var(--yellow-light);

}


/* =====================================================
   MAIN
===================================================== */

.container {

    max-width: 1100px;

    margin: auto;

    padding: 35px 18px 50px;

}


/* =====================================================
   HERO
===================================================== */

.hero {

    background: white;

    border-radius: 24px;

    padding: 35px 30px;

    border: 1px solid var(--border);

    box-shadow:
        0 5px 20px rgba(22,101,52,.07);

    margin-bottom: 25px;

}


.hero-badge {

    display: inline-block;

    background: var(--yellow-light);

    color: #854d0e;

    padding: 7px 13px;

    border-radius: 20px;

    font-size: 14px;

    font-weight: bold;

    margin-bottom: 13px;

}


.hero h1 {

    font-size: 32px;

    line-height: 1.25;

    color: var(--green-dark);

    margin-bottom: 10px;

}


.hero p {

    color: var(--muted);

    line-height: 1.7;

    max-width: 700px;

}


/* =====================================================
   QUICK SYSTEMS
===================================================== */

.section-title {

    margin-bottom: 15px;

}


.section-title h2 {

    font-size: 22px;

    color: var(--green-dark);

}


.section-title p {

    color: var(--muted);

    margin-top: 5px;

    font-size: 14px;

}


.system-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 16px;

}


.system-card {

    text-decoration: none;

    color: var(--text);

    background: white;

    border: 1px solid var(--border);

    border-radius: 18px;

    padding: 22px;

    display: flex;

    align-items: center;

    gap: 17px;

    transition:
        transform .2s,
        box-shadow .2s,
        border-color .2s;

}


.system-card:hover {

    transform: translateY(-3px);

    border-color: #86efac;

    box-shadow:
        0 8px 22px rgba(22,101,52,.10);

}


.icon {

    width: 54px;
    height: 54px;

    flex-shrink: 0;

    border-radius: 15px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 27px;

}


.icon-blue {

    background: var(--green-light);

}


.icon-yellow {

    background: var(--yellow-light);

}


.system-info {

    flex: 1;

}


.system-info h3 {

    color: var(--green-dark);

    font-size: 18px;

    margin-bottom: 5px;

}


.system-info p {

    color: var(--muted);

    font-size: 14px;

    line-height: 1.5;

}


.arrow {

    color: #86a58f;

    font-size: 22px;

}


/* =====================================================
   MAP CARD
===================================================== */

.map-card {

    margin-top: 25px;

    background: white;

    border: 1px solid var(--border);

    border-radius: 20px;

    padding: 23px;

    box-shadow:
        0 5px 18px rgba(22,101,52,.06);

}


.map-head {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 15px;

}


.map-head h2 {

    color: var(--green-dark);

    font-size: 21px;

}


.map-head p {

    color: var(--muted);

    font-size: 14px;

    margin-top: 4px;

}


.map-button {

    text-decoration: none;

    background: var(--green);

    color: white;

    padding: 10px 15px;

    border-radius: 10px;

    font-weight: bold;

    font-size: 14px;

}


.map-button:hover {

    background: var(--green-dark);

}


/* =====================================================
   MAP PREVIEW
===================================================== */

.map-preview {

    width: 100%;

    min-height: 220px;

    background: var(--green-light);

    border-radius: 15px;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    border: 1px solid #bbf7d0;

}


.map-preview img {

    width: 100%;

    max-height: 400px;

    object-fit: contain;

    display: block;

}


.map-placeholder {

    text-align: center;

    padding: 30px;

    color: var(--muted);

}


.map-placeholder .map-icon {

    font-size: 45px;

    margin-bottom: 10px;

}


/* =====================================================
   NOTICE
===================================================== */

.notice {

    margin-top: 25px;

    background: var(--yellow-light);

    border: 1px solid #fde68a;

    border-radius: 17px;

    padding: 18px 20px;

    display: flex;

    align-items: flex-start;

    gap: 13px;

}


.notice-icon {

    font-size: 23px;

}


.notice h3 {

    color: #854d0e;

    margin-bottom: 4px;

    font-size: 16px;

}


.notice p {

    color: #78716c;

    font-size: 14px;

    line-height: 1.6;

}


/* =====================================================
   FOOTER
===================================================== */

footer {

    margin-top: 35px;

    text-align: center;

    color: #7c8f82;

    font-size: 13px;

    line-height: 1.7;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px) {

    .header-inner {

        align-items: flex-start;

    }


    .admin-button {

        font-size: 13px;

        padding: 9px 11px;

    }


    .hero {

        padding: 28px 22px;

    }


    .hero h1 {

        font-size: 27px;

    }


    .system-grid {

        grid-template-columns: 1fr;

    }


    .map-head {

        flex-direction: column;

        align-items: flex-start;

    }


    .map-button {

        width: 100%;

        text-align: center;

    }

}


@media(max-width:450px) {

    .logo-box {

        width: 42px;
        height: 42px;

        font-size: 21px;

    }


    .logo {

        font-size: 22px;

    }


    .subtitle {

        font-size: 12px;

    }


    .admin-button {

        display: none;

    }


    .hero h1 {

        font-size: 24px;

    }

}

</style>
