<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>แจ้งปัญหา | BEN2 BINCARE</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f8ff;
            color: #172554;
            min-height: 100vh;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: linear-gradient(135deg, #0759d7, #1687ff);
            color: white;
            padding: 22px 20px;
            box-shadow: 0 4px 18px rgba(7, 89, 215, .25);
            border-bottom: 5px solid #ffd21f;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: .5px;
        }

        header div:last-child {
            margin-top: 4px;
            color: #fff9d6;
            font-weight: bold;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            max-width: 700px;
            margin: auto;
            padding: 28px 18px 40px;
        }

        /* =========================
           BACK
        ========================= */

        .back {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 18px;
            color: #0759d7;
            text-decoration: none;
            font-weight: 800;
            background: white;
            padding: 9px 14px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,.06);
            transition: .2s;
        }

        .back:hover {
            transform: translateX(-3px);
            color: #ffb800;
            background: #e8f1ff;
        }

        /* =========================
           CARD
        ========================= */

        .card {
            background: white;
            border-radius: 24px;
            padding: 28px;
            border: 1px solid #dbeafe;
            box-shadow: 0 8px 30px rgba(30, 64, 175, .10);
        }

        h1 {
            color: #123b8f;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 26px;
            line-height: 1.6;
        }

        /* =========================
           FORM
        ========================= */

        label {
            display: block;
            font-weight: 800;
            margin-top: 18px;
            margin-bottom: 8px;
            color: #123b8f;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #dbeafe;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            background: #f4f8ff;
            color: #172554;
            outline: none;
            transition: .2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #1687ff;
            background: white;
            box-shadow: 0 0 0 4px rgba(22, 135, 255, .12);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        /* =========================
           BUTTON
        ========================= */

        button {
            width: 100%;
            margin-top: 26px;
            padding: 15px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, #ffd21f, #ffb800);
            color: #172554;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(255, 210, 31, .28);
            transition: .2s;
        }

        button:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #ffca00, #ffb000);
            box-shadow: 0 9px 20px rgba(255, 210, 31, .35);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* =========================
           MESSAGE
        ========================= */

        .message {
            display: none;
            margin-top: 20px;
            padding: 16px;
            border-radius: 13px;
            line-height: 1.6;
        }

        .success {
            background: #dcfce7;
            border: 2px solid #86efac;
            color: #087443;
        }

        .error {
            background: #ffe4e2;
            border: 2px solid #ffaaa5;
            color: #c62828;
        }

        /* =========================
           TICKET
        ========================= */

        .ticket {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 14px;
            border-radius: 10px;
            background: #fff8cc;
            color: #765900;
            border: 1px solid #ffe066;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                padding: 18px;
            }

            .logo {
                font-size: 25px;
            }

            .container {
                padding: 20px 14px 30px;
            }

            .card {
                padding: 22px 18px;
                border-radius: 20px;
            }

            h1 {
                font-size: 24px;
            }

        }

    </style>
</head>


<body>

<header>

    <div class="logo">
        BEN2 BINCARE
    </div>

    <div>
        ระบบแจ้งปัญหาภายในโรงเรียน
    </div>

</header>


<div class="container">

    <a href="index.html" class="back">
        ← กลับหน้าหลัก
    </a>


    <div class="card">

        <h1>
            🚨 แจ้งปัญหา
        </h1>

        <p class="subtitle">
            พบปัญหาภายในโรงเรียน สามารถแจ้งให้เจ้าหน้าที่ตรวจสอบได้
        </p>


        <form id="reportForm">

            <label for="category">
                ประเภทปัญหา
            </label>

            <select id="category" required>

                <option value="">
                    -- เลือกประเภท --
                </option>

                <option value="ถังขยะ">
                    🚮 ถังขยะ
                </option>

                <option value="ไฟฟ้า">
                    💡 ไฟฟ้า
                </option>

                <option value="น้ำประปา">
                    🚰 น้ำประปา
                </option>

                <option value="โต๊ะเก้าอี้">
                    🪑 โต๊ะ / เก้าอี้
                </option>

                <option value="ความสะอาด">
                    🧹 ความสะอาด
                </option>

                <option value="อาคารสถานที่">
                    🏫 อาคาร / สถานที่
                </option>

                <option value="ของหาย">
                    📦 ของหาย
                </option>

                <option value="อื่นๆ">
                    📝 อื่น ๆ
                </option>

            </select>


            <label for="title">
                หัวข้อปัญหา
            </label>

            <input
                id="title"
                type="text"
                placeholder="เช่น ถังขยะเต็ม"
                required
            >


            <label for="location">
                สถานที่
            </label>

            <input
                id="location"
                type="text"
                placeholder="เช่น อาคาร 2 ชั้น 3"
                required
            >


            <label for="description">
                รายละเอียด
            </label>

            <textarea
                id="description"
                placeholder="อธิบายปัญหาที่พบ..."
            ></textarea>


            <button
                id="submitButton"
                type="submit">

                🚨 ส่งแจ้งปัญหา

            </button>

        </form>


        <div
            id="successMessage"
            class="message success">

            <strong>
                ✅ แจ้งปัญหาสำเร็จ!
            </strong>

            <div>
                กรุณาเก็บเลขที่แจ้งนี้ไว้เพื่อตรวจสอบสถานะ
            </div>

            <div
                id="ticketNumber"
                class="ticket">
            </div>

        </div>


        <div
            id="errorMessage"
            class="message error">

            <strong>
                ❌ ไม่สามารถส่งข้อมูลได้
            </strong>

            <div id="errorText"></div>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://pbjeyvupzbhxodlibjuh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_paiTf1uzpiCAPR1oWQMlDg_PfVzT2p6";


function generateTicket() {

    const number =
        Math.floor(
            100000 +
            Math.random() * 900000
        );

    return "ISSUE-" + number;
}


document
    .getElementById("reportForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const button =
                document.getElementById(
                    "submitButton"
                );


            const successMessage =
                document.getElementById(
                    "successMessage"
                );


            const errorMessage =
                document.getElementById(
                    "errorMessage"
                );


            const errorText =
                document.getElementById(
                    "errorText"
                );


            button.disabled = true;

            button.textContent =
                "กำลังส่งข้อมูล...";


            successMessage.style.display =
                "none";

            errorMessage.style.display =
                "none";


            const ticket =
                generateTicket();


            const data = {

                ticket_number:
                    ticket,

                category:
                    document.getElementById(
                        "category"
                    ).value,

                title:
                    document.getElementById(
                        "title"
                    ).value,

                description:
                    document.getElementById(
                        "description"
                    ).value,

                location:
                    document.getElementById(
                        "location"
                    ).value

            };


            try {

                const response =
                    await fetch(
                        SUPABASE_URL +
                        "/rest/v1/reports",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    "Bearer " +
                                    SUPABASE_KEY,

                                "Prefer":
                                    "return=minimal"

                            },

                            body:
                                JSON.stringify(data)

                        }
                    );


                if (!response.ok) {

                    const error =
                        await response.text();

                    throw new Error(error);

                }


                document
                    .getElementById(
                        "ticketNumber"
                    )
                    .textContent =
                    ticket;


                successMessage.style.display =
                    "block";


                document
                    .getElementById(
                        "reportForm"
                    )
                    .reset();


            }

            catch (error) {

                console.error(error);


                errorText.textContent =
                    "กรุณาลองใหม่อีกครั้ง";


                errorMessage.style.display =
                    "block";

            }


            button.disabled = false;

            button.textContent =
                "🚨 ส่งแจ้งปัญหา";

        }
    );

</script>

</body>

</html>
