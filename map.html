<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>แผนที่โรงเรียน | BEN2 BINCARE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f8ff;
    color: #172554;
}

/* =========================
   HEADER
========================= */

header {
    background: linear-gradient(135deg, #0759d7, #1687ff);
    color: white;
    padding: 22px 20px;
    box-shadow: 0 4px 18px rgba(7, 89, 215, .25);
    border-bottom: 5px solid #ffd21f;
}

.logo {
    font-size: 29px;
    font-weight: 900;
    letter-spacing: .5px;
}

header > div:last-child {
    margin-top: 3px;
    font-size: 15px;
    opacity: .95;
}

/* =========================
   CONTAINER
========================= */

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px 18px 40px;
}

.back {
    display: inline-flex;
    align-items: center;

    margin-bottom: 16px;

    padding: 10px 15px;

    background: white;

    color: #0759d7;

    text-decoration: none;

    font-weight: 800;
    font-size: 15px;

    border-radius: 12px;

    border: 1px solid #dbeafe;

    box-shadow:
        0 4px 12px rgba(30, 64, 175, .08);

    transition: .2s;
}

.back:hover {
    color: #0049bd;

    background: #f8fbff;

    border-color: #b8d5ff;

    transform: translateY(-1px);

    box-shadow:
        0 6px 16px rgba(30, 64, 175, .12);
}

/* =========================
   CARD
========================= */

.card {
    background: white;
    border-radius: 24px;
    padding: 24px;
    box-shadow: 0 8px 30px rgba(30, 64, 175, .10);
    border: 1px solid #dbeafe;
}

h1 {
    margin-bottom: 8px;
    color: #123b8f;
    font-size: 28px;
}

.subtitle {
    color: #64748b;
    margin-bottom: 20px;
    line-height: 1.6;
}

/* =========================
   CONTROLS
========================= */

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 12px 18px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    transform: translateY(-1px);
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
    transform: none;
}

.add-btn {
    background: #ffd21f;
    color: #172554;
    box-shadow: 0 4px 12px rgba(255, 210, 31, .28);
}

.add-btn:hover {
    background: #ffca00;
}

.admin-btn {
    background: #0759d7;
    color: white;
    box-shadow: 0 4px 12px rgba(7, 89, 215, .22);
}

.admin-btn:hover {
    background: #0049bd;
}

.refresh-btn {
    background: #e8f1ff;
    color: #0759d7;
}

.refresh-btn:hover {
    background: #dbeafe;
}

/* =========================
   HINT
========================= */

.hint {
    background: linear-gradient(
        135deg,
        #fff9d6,
        #fff4a8
    );

    color: #765900;

    padding: 14px 16px;

    border-radius: 13px;

    margin-bottom: 15px;

    border-left: 5px solid #ffd21f;

    font-weight: 700;
}

/* =========================
   MAP
========================= */

.map-wrapper {
    position: relative;
    width: 100%;
    overflow: hidden;
    border-radius: 18px;
    border: 3px solid #b8d5ff;
    background: #eef5ff;
    touch-action: none;
    box-shadow: 0 6px 20px rgba(30, 64, 175, .12);
}

#schoolMap {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    pointer-events: none;
}

/* =========================
   หมุดถังขยะ
========================= */

.bin {
    position: absolute;
    transform: translate(-50%, -50%);
    z-index: 10;
    cursor: pointer;
    user-select: none;
    touch-action: none;
}

.bin-icon {
    width: 46px;
    height: 46px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;

    background: white;

    border: 4px solid #18b96f;

    box-shadow:
        0 4px 12px rgba(15, 23, 42, .25);
}

.bin.normal .bin-icon {
    border-color: #18b96f;
}

.bin.near_full .bin-icon {
    border-color: #ffc400;
}

.bin.full .bin-icon {
    border-color: #ff3b30;
}

.bin-label {
    position: absolute;

    top: 50px;
    left: 50%;

    transform: translateX(-50%);

    white-space: nowrap;

    background: white;

    padding: 6px 10px;

    border-radius: 9px;

    font-size: 12px;

    font-weight: 800;

    color: #172554;

    box-shadow:
        0 3px 10px rgba(15, 23, 42, .18);

    border: 1px solid #dbeafe;
}

/* =========================
   MODAL
========================= */

.modal-bg {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(15, 23, 42, .55);

    z-index: 100;

    align-items: center;
    justify-content: center;

    padding: 20px;

    backdrop-filter: blur(3px);
}

.modal-bg.show {
    display: flex;
}

.modal {
    background: white;

    width: 100%;
    max-width: 420px;

    border-radius: 24px;

    padding: 25px;

    box-shadow:
        0 15px 50px rgba(15, 23, 42, .25);

    border-top: 6px solid #ffd21f;
}

.modal h2 {
    margin-bottom: 20px;
    color: #123b8f;
}

.modal label {
    display: block;

    font-weight: 800;

    margin-top: 15px;

    margin-bottom: 7px;

    color: #172554;
}

.modal input,
.modal select {
    width: 100%;

    padding: 12px;

    border: 2px solid #dbeafe;

    border-radius: 11px;

    font-size: 16px;

    color: #172554;

    outline: none;
}

.modal input:focus,
.modal select:focus {
    border-color: #1687ff;
    box-shadow: 0 0 0 3px rgba(22, 135, 255, .12);
}

.modal-buttons {
    display: flex;

    gap: 10px;

    margin-top: 20px;
}

.save-btn {
    flex: 1;

    background: #0759d7;

    color: white;
}

.save-btn:hover {
    background: #0049bd;
}

.delete-btn {
    flex: 1;

    background: #ff3b30;

    color: white;
}

.delete-btn:hover {
    background: #dc2626;
}

.cancel-btn {
    flex: 1;

    background: #e8f1ff;

    color: #0759d7;
}

/* =========================
   STATUS
========================= */

.status-box {
    margin-top: 18px;

    padding: 13px;

    border-radius: 11px;

    text-align: center;

    font-weight: 800;
}

.status-normal {
    background: #dcfce7;
    color: #087443;
    border: 1px solid #86efac;
}

.status-near {
    background: #fff8cc;
    color: #806000;
    border: 1px solid #ffe066;
}

.status-full {
    background: #ffe4e2;
    color: #c62828;
    border: 1px solid #ffaaa5;
}

/* =========================
   MESSAGE
========================= */

.message {
    display: none;

    margin-top: 15px;

    padding: 13px;

    border-radius: 11px;

    font-weight: 800;
}

.message.show {
    display: block;
}

.message.success {
    background: #dcfce7;
    color: #087443;
    border: 1px solid #86efac;
}

.message.error {
    background: #ffe4e2;
    color: #c62828;
    border: 1px solid #ffaaa5;
}

/* =========================
   ADMIN
========================= */

.admin-panel {
    display: none;

    background: linear-gradient(
        135deg,
        #e8f1ff,
        #dbeafe
    );

    padding: 16px;

    border-radius: 14px;

    margin-bottom: 15px;

    border: 1px solid #b8d5ff;
}

.admin-panel.show {
    display: block;
}

.admin-panel strong {
    color: #0759d7;
}

.admin-info {
    margin-top: 7px;

    color: #2454a6;

    font-weight: 600;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    header {
        padding: 18px;
    }

    .logo {
        font-size: 25px;
    }

    .card {
        padding: 18px;
        border-radius: 20px;
    }

    h1 {
        font-size: 24px;
    }

    .controls {
        flex-direction: column;
    }

    .controls button {
        width: 100%;
    }

    .modal-buttons {
        flex-direction: column;
    }

    .modal-buttons button {
        width: 100%;
    }

    .bin-icon {
        width: 40px;
        height: 40px;
        font-size: 22px;
    }

    .bin-label {
        top: 43px;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        BEN2 BINCARE
    </div>

    <div>
        ระบบดูแลโรงเรียน
    </div>

</header>


<div class="container">


<a
    href="index.html"
    class="back">

    ← กลับหน้าหลัก

</a>


<div class="card">


<h1>
    🗺️ แผนที่โรงเรียน
</h1>


<p class="subtitle">
    แสดงตำแหน่งและสถานะถังขยะภายในโรงเรียน
</p>


<div class="controls">


<button
    class="add-btn"
    id="addBinButton"

        💡 กดหมุด 🗑️ เพื่อแก้ไขสถานะ

    </p>

    หากต้องการจัดการถังขยะ

<div

    id="mapWrapper">


<img
    id="schoolMap"
    src="school-map.png"
    alt="แผนผังโรงเรียน">

</div>

</div>


<!-- =========================
     Modal แก้ไขถังขยะ
========================= -->

<div
    id="modalBg"
    class="modal-bg">


<div class="modal">


<h2>

</h2>

</div>


</div>

</div>


<script>


/* =========================
   Supabase
========================= */

const SUPABASE_URL =
"https://pbjeyvupzbhxodlibjuh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_paiTf1uzpiCAPR1oWQMlDg_PfVzT2p6";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ตัวแปร
========================= */

let adminMode = false;

let addingBin = false;

let currentBin = null;

let draggingBin = null;


/* =========================
   ตรวจสอบ Login
========================= */

async function checkLogin() {

    const {
        data: { session }
    } =
    await supabaseClient
        .auth
        .getSession();


    return session;

}


/* =========================
   เปิดโหมดแอดมิน
========================= */

async function toggleAdmin() {

    if (!adminMode) {

        const session =
            await checkLogin();


        if (!session) {

            alert(
                "🔐 กรุณาเข้าสู่ระบบเจ้าหน้าที่ก่อน"
            );

            window.location.href =
                "admin-login.html";

            return;

        }


        adminMode = true;


        document
            .getElementById("adminPanel")
            .classList.add("show");


        document
            .getElementById("adminButton")
            .textContent =
                "🔓 ปิดโหมดแอดมิน";


        document
            .getElementById("hint")
            .textContent =
                "🛠️ โหมดแอดมิน: กดหมุดเพื่อแก้ไข หรือกด 'เพิ่มถังขยะ'";


        showMessage(
            "เปิดโหมดแอดมินแล้ว",
            "success"
        );


    } else {

        adminMode = false;

        addingBin = false;


        document
            .getElementById("adminPanel")
            .classList.remove("show");


        document
            .getElementById("adminButton")
            .textContent =
                "🔐 โหมดแอดมิน";


        document
            .getElementById("hint")
            .textContent =
                "💡 เปิดโหมดแอดมินก่อน หากต้องการจัดการถังขยะ";


        showMessage(
            "ปิดโหมดแอดมินแล้ว",
            "success"
        );

    }


    loadBins();

}


/* =========================
   เพิ่มถัง
========================= */

function startAddBin() {

    if (!adminMode) {

        alert(
            "🔐 กรุณาเปิดโหมดแอดมินก่อน"
        );

        return;

    }


    addingBin = true;


    document
        .getElementById("hint")
        .textContent =
        "📍 กดตำแหน่งบนแผนที่เพื่อวางถังขยะ";


    document
        .getElementById("addBinButton")
        .disabled = true;

}


/* =========================
   คลิกแผนที่
========================= */

document
    .getElementById("mapWrapper")
    .addEventListener(
        "click",
        async function(event) {


        if (!addingBin)
            return;


        if (
            event.target.closest(".bin")
        )
            return;


        const rect =
            this.getBoundingClientRect();


        const x =
            ((event.clientX - rect.left)
            / rect.width) * 100;


        const y =
            ((event.clientY - rect.top)
            / rect.height) * 100;


        addingBin = false;


        document
            .getElementById("addBinButton")
            .disabled = false;


        document
            .getElementById("hint")
            .textContent =
            "🛠️ กดหมุดเพื่อแก้ไข หรือกด 'เพิ่มถังขยะ'";


        await addBin(x, y);

    });


/* =========================
   เพิ่มข้อมูล
========================= */

async function addBin(x, y) {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("trash_bins")
        .insert({

            name: "ถังขยะ",

            x: x,

            y: y,

            status: "normal"

        })
        .select()
        .single();


    if (error) {

        console.error(error);

        showMessage(
            "❌ เพิ่มถังขยะไม่สำเร็จ: " +
            error.message,
            "error"
        );

        return;

    }


    showMessage(
        "✅ เพิ่มถังขยะเรียบร้อย",
        "success"
    );


    loadBins();

}


/* =========================
   โหลดถัง
========================= */

async function loadBins() {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("trash_bins")
        .select("*")
        .order("id");


    if (error) {

        console.error(error);

        showMessage(
            "❌ โหลดข้อมูลถังขยะไม่สำเร็จ: " +
            error.message,
            "error"
        );

        return;

    }


    document
        .querySelectorAll(".bin")
        .forEach(
            bin => bin.remove()
        );


    data.forEach(bin => {

        createBinMarker(bin);

    });

}


/* =========================
   สร้างหมุด
========================= */

function createBinMarker(binData) {

    const wrapper =
        document.getElementById("mapWrapper");


    const marker =
        document.createElement("div");


    marker.className =
        "bin " +
        getStatusClass(
            binData.status
        );


    marker.style.left =
        Number(binData.x) + "%";


    marker.style.top =
        Number(binData.y) + "%";


    const icon =
        document.createElement("div");


    icon.className =
        "bin-icon";


    icon.textContent =
        "🗑️";


    marker.appendChild(icon);


    const label =
        document.createElement("div");


    label.className =
        "bin-label";


    label.textContent =
        getStatusEmoji(binData.status)
        + " "
        + (binData.name || "ถังขยะ");


    marker.appendChild(label);


    /* =====================
       คลิกหมุด
    ===================== */

    marker.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();


            if (!adminMode)
                return;


            openBinModal(binData);

        }
    );


    /* =====================
       ลากหมุด
    ===================== */

    if (adminMode) {

        let dragging = false;


        marker.addEventListener(
            "pointerdown",
            function(event) {

                event.stopPropagation();

                dragging = true;

                draggingBin = binData;

                marker.setPointerCapture(
                    event.pointerId
                );

            }
        );


        marker.addEventListener(
            "pointermove",
            function(event) {

                if (!dragging)
                    return;


                const rect =
                    wrapper.getBoundingClientRect();


                let x =
                    ((event.clientX - rect.left)
                    / rect.width) * 100;


                let y =
                    ((event.clientY - rect.top)
                    / rect.height) * 100;


                x = Math.max(
                    0,
                    Math.min(100, x)
                );


                y = Math.max(
                    0,
                    Math.min(100, y)
                );


                marker.style.left =
                    x + "%";


                marker.style.top =
                    y + "%";

            }
        );


        marker.addEventListener(
            "pointerup",
            async function(event) {

                if (!dragging)
                    return;


                dragging = false;


                const rect =
                    wrapper.getBoundingClientRect();


                let x =
                    ((event.clientX - rect.left)
                    / rect.width) * 100;


                let y =
                    ((event.clientY - rect.top)
                    / rect.height) * 100;


                x = Math.max(
                    0,
                    Math.min(100, x)
                );


                y = Math.max(
                    0,
                    Math.min(100, y)
                );


                await updatePosition(
                    binData.id,
                    x,
                    y
                );


                draggingBin = null;

            }
        );

    }


    wrapper.appendChild(marker);

}


/* =========================
   เปิดหน้าต่างแก้ไข
========================= */

function openBinModal(binData) {

    currentBin = binData;


    document
        .getElementById("binName")
        .value =
        binData.name || "ถังขยะ";


    document
        .getElementById("binStatus")
        .value =
        binData.status || "normal";


    updateStatusPreview();


    document
        .getElementById("modalBg")
        .classList.add("show");

}


/* =========================
   ปิดหน้าต่าง
========================= */

function closeModal() {

    currentBin = null;


    document
        .getElementById("modalBg")
        .classList.remove("show");

}


/* =========================
   Preview สถานะ
========================= */

document
    .getElementById("binStatus")
    .addEventListener(
        "change",
        updateStatusPreview
    );


function updateStatusPreview() {

    const status =
        document
            .getElementById("binStatus")
            .value;


    const preview =
        document
            .getElementById("statusPreview");


    preview.className =
        "status-box " +
        getStatusBoxClass(status);


    preview.textContent =
        getStatusEmoji(status)
        + " "
        + getStatusText(status);

}


/* =========================
   บันทึกถัง
========================= */

async function saveBin() {

    if (!currentBin)
        return;


    const name =
        document
            .getElementById("binName")
            .value
            .trim();


    const status =
        document
            .getElementById("binStatus")
            .value;


    if (!name) {

        alert(
            "กรุณาใส่ชื่อถังขยะ"
        );

        return;

    }


    const {
        error
    } =
    await supabaseClient
        .from("trash_bins")
        .update({

            name: name,

            status: status

        })
        .eq(
            "id",
            currentBin.id
        );


    if (error) {

        console.error(error);

        alert(
            "❌ บันทึกไม่สำเร็จ\n" +
            error.message
        );

        return;

    }


    closeModal();


    showMessage(
        "✅ บันทึกข้อมูลถังขยะแล้ว",
        "success"
    );


    loadBins();

}


/* =========================
   เปลี่ยนตำแหน่ง
========================= */

async function updatePosition(
    id,
    x,
    y
) {

    const {
        error
    } =
    await supabaseClient
        .from("trash_bins")
        .update({

            x: x,

            y: y

        })
        .eq(
            "id",
            id
        );


    if (error) {

        console.error(error);

        showMessage(
            "❌ บันทึกตำแหน่งไม่สำเร็จ",
            "error"
        );

        loadBins();

        return;

    }


    showMessage(
        "✅ บันทึกตำแหน่งใหม่แล้ว",
        "success"
    );

}


/* =========================
   ลบถัง
========================= */

async function deleteCurrentBin() {

    if (!currentBin)
        return;


    const confirmDelete =
        confirm(
            "⚠️ ต้องการลบถังขยะนี้ใช่หรือไม่?"
        );


    if (!confirmDelete)
        return;


    const {
        error
    } =
    await supabaseClient
        .from("trash_bins")
        .delete()
        .eq(
            "id",
            currentBin.id
        );


    if (error) {

        console.error(error);

        alert(
            "❌ ลบถังขยะไม่สำเร็จ\n" +
            error.message
        );

        return;

    }


    closeModal();


    showMessage(
        "🗑️ ลบถังขยะเรียบร้อย",
        "success"
    );


    loadBins();

}


/* =========================
   สถานะ
========================= */

function getStatusText(status) {

    if (status === "near_full")
        return "ใกล้เต็ม";

    if (status === "full")
        return "เต็ม";

    return "ปกติ";

}


function getStatusEmoji(status) {

    if (status === "near_full")
        return "🟡";

    if (status === "full")
        return "🔴";

    return "🟢";

}


function getStatusClass(status) {

    if (status === "near_full")
        return "near_full";

    if (status === "full")
        return "full";

    return "normal";

}


function getStatusBoxClass(status) {

    if (status === "near_full")
        return "status-near";

    if (status === "full")
        return "status-full";

    return "status-normal";

}


/* =========================
   ข้อความแจ้งเตือน
========================= */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById("message");


    message.textContent =
        text;


    message.className =
        "message show " +
        type;


    setTimeout(
        function() {

            message.className =
                "message";

        },
        3000
    );

}


/* =========================
   เริ่มต้น
========================= */

async function initialize() {

    const session =
        await checkLogin();


    if (session) {

        document
            .getElementById("adminInfo")
            .textContent =
            "👤 เจ้าหน้าที่เข้าสู่ระบบแล้ว";

    }


    loadBins();

}


initialize();

</script>
