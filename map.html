<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>แผนที่โรงเรียน | BEN2 BINCARE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7f5;
    color: #1f2937;
}

header {
    background: #166534;
    color: white;
    padding: 20px;
}

.logo {
    font-size: 26px;
    font-weight: bold;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px 18px;
}

.back {
    display: inline-block;
    margin-bottom: 15px;
    color: #166534;
    text-decoration: none;
    font-weight: bold;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h1 {
    margin-bottom: 8px;
}

.subtitle {
    color: #6b7280;
    margin-bottom: 20px;
}

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.add-btn {
    background: #16a34a;
    color: white;
}

.admin-btn {
    background: #1d4ed8;
    color: white;
}

.refresh-btn {
    background: #6b7280;
    color: white;
}

.login-btn {
    background: #7c3aed;
    color: white;
}

.hint {
    background: #f0fdf4;
    color: #166534;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.map-wrapper {
    position: relative;
    width: 100%;
    overflow: hidden;
    border-radius: 15px;
    border: 2px solid #d1d5db;
    background: #eee;
    touch-action: none;
}

#schoolMap {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    pointer-events: none;
}


/* =========================
   หมุดถังขยะ
========================= */

.bin {
    position: absolute;
    transform: translate(-50%, -50%);
    z-index: 10;
    cursor: pointer;
    user-select: none;
    touch-action: none;
}

.bin-icon {
    width: 44px;
    height: 44px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;

    background: white;

    border: 4px solid #16a34a;

    box-shadow:
        0 3px 10px rgba(0,0,0,0.25);
}

.bin.normal .bin-icon {
    border-color: #16a34a;
}

.bin.near_full .bin-icon {
    border-color: #eab308;
}

.bin.full .bin-icon {
    border-color: #dc2626;
}

.bin-label {
    position: absolute;

    top: 48px;
    left: 50%;

    transform: translateX(-50%);

    white-space: nowrap;

    background: white;

    padding: 5px 9px;

    border-radius: 8px;

    font-size: 12px;

    font-weight: bold;

    box-shadow:
        0 2px 7px rgba(0,0,0,0.2);
}


/* =========================
   หน้าต่างแก้ไข
========================= */

.modal-bg {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.45);

    z-index: 100;
    
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.modal-bg.show {
    display: flex;
}

.modal {
    background: white;

    width: 100%;
    max-width: 420px;

    border-radius: 20px;

    padding: 25px;

    box-shadow:
        0 10px 40px rgba(0,0,0,0.25);
}

.modal h2 {
    margin-bottom: 20px;
}

.modal label {
    display: block;

    font-weight: bold;

    margin-top: 15px;

    margin-bottom: 7px;
}

.modal input,
.modal select {
    width: 100%;

    padding: 12px;

    border: 1px solid #d1d5db;

    border-radius: 10px;

    font-size: 16px;
}

.modal-buttons {
    display: flex;

    gap: 10px;

    margin-top: 20px;
}

.save-btn {
    flex: 1;

    background: #16a34a;

    color: white;
}

.delete-btn {
    flex: 1;

    background: #dc2626;

    color: white;
}

.cancel-btn {
    flex: 1;

    background: #6b7280;

    color: white;
}


/* =========================
   สถานะ
========================= */

.status-box {
    margin-top: 18px;

    padding: 12px;

    border-radius: 10px;

    text-align: center;

    font-weight: bold;
}

.status-normal {
    background: #dcfce7;
    color: #166534;
}

.status-near {
    background: #fef9c3;
    color: #854d0e;
}

.status-full {
    background: #fee2e2;
    color: #991b1b;
}


/* =========================
   ข้อความ
========================= */

.message {
    display: none;

    margin-top: 15px;

    padding: 12px;

    border-radius: 10px;

    font-weight: bold;
}

.message.show {
    display: block;
}

.message.success {
    background: #dcfce7;
    color: #166534;
}

.message.error {
    background: #fee2e2;
    color: #991b1b;
}


/* =========================
   Admin
========================= */

.admin-panel {
    display: none;

    background: #eff6ff;

    padding: 15px;

    border-radius: 12px;

    margin-bottom: 15px;
}

.admin-panel.show {
    display: block;
}

.admin-info {
    margin-top: 7px;

    color: #1e40af;
}


/* =========================
   Responsive
========================= */

@media(max-width:600px) {

    .modal-buttons {
        flex-direction: column;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        BINCARE
    </div>

    <div>
        ระบบดูแลโรงเรียน
    </div>

</header>


<div class="container">


<a
    href="index.html"
    class="back">

    ← กลับหน้าหลัก

</a>


<div class="card">


<h1>
    🗺️ แผนที่โรงเรียน
</h1>


<p class="subtitle">
    แสดงตำแหน่งและสถานะถังขยะภายในโรงเรียน
</p>


<div class="controls">


<button
    class="add-btn"
    id="addBinButton"
    onclick="startAddBin()">

    ➕ เพิ่มถังขยะ

</button>


<button
    class="admin-btn"
    id="adminButton"
    onclick="toggleAdmin()">

    🔐 โหมดแอดมิน

</button>


<button
    class="refresh-btn"
    onclick="loadBins()">

    🔄 รีเฟรช

</button>


</div>


<div
    id="adminPanel"
    class="admin-panel">

    <strong>
        🛠️ โหมดแอดมินเปิดอยู่
    </strong>

    <div
        id="adminInfo"
        class="admin-info">
    </div>

    <p style="margin-top:8px;">
        💡 กดหมุด 🗑️ เพื่อแก้ไขสถานะ
        และลากหมุดเพื่อย้ายตำแหน่ง
    </p>

</div>


<div
    id="hint"
    class="hint">

    💡 เปิดโหมดแอดมินก่อน
    หากต้องการจัดการถังขยะ

</div>


<div
    class="map-wrapper"
    id="mapWrapper">


<img
    id="schoolMap"
    src="school-map.png"
    alt="แผนผังโรงเรียน">


</div>


<div
    id="message"
    class="message">
</div>


</div>

</div>


<!-- =========================
     Modal แก้ไขถังขยะ
========================= -->

<div
    id="modalBg"
    class="modal-bg">


<div class="modal">


<h2>
    🗑️ แก้ไขถังขยะ
</h2>


<label>
    ชื่อถังขยะ
</label>


<input
    id="binName"
    type="text"
    placeholder="ชื่อถังขยะ">


<label>
    สถานะ
</label>


<select id="binStatus">

    <option value="normal">
        🟢 ปกติ
    </option>

    <option value="near_full">
        🟡 ใกล้เต็ม
    </option>

    <option value="full">
        🔴 เต็ม
    </option>

</select>


<div
    id="statusPreview"
    class="status-box status-normal">

    🟢 ปกติ

</div>


<div class="modal-buttons">


<button
    class="save-btn"
    onclick="saveBin()">

    💾 บันทึก

</button>


<button
    class="delete-btn"
    onclick="deleteCurrentBin()">

    🗑️ ลบ

</button>


<button
    class="cancel-btn"
    onclick="closeModal()">

    ยกเลิก

</button>


</div>


</div>

</div>


<script>


/* =========================
   Supabase
========================= */

const SUPABASE_URL =
"https://pbjeyvupzbhxodlibjuh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_paiTf1uzpiCAPR1oWQMlDg_PfVzT2p6";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ตัวแปร
========================= */

let adminMode = false;

let addingBin = false;

let currentBin = null;

let draggingBin = null;


/* =========================
   ตรวจสอบ Login
========================= */

async function checkLogin() {

    const {
        data: { session }
    } =
    await supabaseClient
        .auth
        .getSession();


    return session;

}


/* =========================
   เปิดโหมดแอดมิน
========================= */

async function toggleAdmin() {

    if (!adminMode) {

        const session =
            await checkLogin();


        if (!session) {

            alert(
                "🔐 กรุณาเข้าสู่ระบบเจ้าหน้าที่ก่อน"
            );

            window.location.href =
                "admin-login.html";

            return;

        }


        adminMode = true;


        document
            .getElementById("adminPanel")
            .classList.add("show");


        document
            .getElementById("adminButton")
            .textContent =
                "🔓 ปิดโหมดแอดมิน";


        document
            .getElementById("hint")
            .textContent =
                "🛠️ โหมดแอดมิน: กดหมุดเพื่อแก้ไข หรือกด 'เพิ่มถังขยะ'";


        showMessage(
            "เปิดโหมดแอดมินแล้ว",
            "success"
        );


    } else {

        adminMode = false;

        addingBin = false;


        document
            .getElementById("adminPanel")
            .classList.remove("show");


        document
            .getElementById("adminButton")
            .textContent =
                "🔐 โหมดแอดมิน";


        document
            .getElementById("hint")
            .textContent =
                "💡 เปิดโหมดแอดมินก่อน หากต้องการจัดการถังขยะ";


        showMessage(
            "ปิดโหมดแอดมินแล้ว",
            "success"
        );

    }


    loadBins();

}


/* =========================
   เพิ่มถัง
========================= */

function startAddBin() {

    if (!adminMode) {

        alert(
            "🔐 กรุณาเปิดโหมดแอดมินก่อน"
        );

        return;

    }


    addingBin = true;


    document
        .getElementById("hint")
        .textContent =
        "📍 กดตำแหน่งบนแผนที่เพื่อวางถังขยะ";


    document
        .getElementById("addBinButton")
        .disabled = true;

}


/* =========================
   คลิกแผนที่
========================= */

document
    .getElementById("mapWrapper")
    .addEventListener(
        "click",
        async function(event) {


        if (!addingBin)
            return;


        if (
            event.target.closest(".bin")
        )
            return;


        const rect =
            this.getBoundingClientRect();


        const x =
            ((event.clientX - rect.left)
            / rect.width) * 100;


        const y =
            ((event.clientY - rect.top)
            / rect.height) * 100;


        addingBin = false;


        document
            .getElementById("addBinButton")
            .disabled = false;


        document
            .getElementById("hint")
            .textContent =
            "🛠️ กดหมุดเพื่อแก้ไข หรือกด 'เพิ่มถังขยะ'";


        await addBin(x, y);

    });


/* =========================
   เพิ่มข้อมูล
========================= */

async function addBin(x, y) {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("trash_bins")
        .insert({

            name: "ถังขยะ",

            x: x,

            y: y,

            status: "normal"

        })
        .select()
        .single();


    if (error) {

        console.error(error);

        showMessage(
            "❌ เพิ่มถังขยะไม่สำเร็จ: " +
            error.message,
            "error"
        );

        return;

    }


    showMessage(
        "✅ เพิ่มถังขยะเรียบร้อย",
        "success"
    );


    loadBins();

}


/* =========================
   โหลดถัง
========================= */

async function loadBins() {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("trash_bins")
        .select("*")
        .order("id");


    if (error) {

        console.error(error);

        showMessage(
            "❌ โหลดข้อมูลถังขยะไม่สำเร็จ: " +
            error.message,
            "error"
        );

        return;

    }


    document
        .querySelectorAll(".bin")
        .forEach(
            bin => bin.remove()
        );


    data.forEach(bin => {

        createBinMarker(bin);

    });

}


/* =========================
   สร้างหมุด
========================= */

function createBinMarker(binData) {

    const wrapper =
        document.getElementById("mapWrapper");


    const marker =
        document.createElement("div");


    marker.className =
        "bin " +
        getStatusClass(
            binData.status
        );


    marker.style.left =
        Number(binData.x) + "%";


    marker.style.top =
        Number(binData.y) + "%";


    const icon =
        document.createElement("div");


    icon.className =
        "bin-icon";


    icon.textContent =
        "🗑️";


    marker.appendChild(icon);


    const label =
        document.createElement("div");


    label.className =
        "bin-label";


    label.textContent =
        getStatusEmoji(binData.status)
        + " "
        + (binData.name || "ถังขยะ");


    marker.appendChild(label);


    /* =====================
       คลิกหมุด
    ===================== */

    marker.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();


            if (!adminMode)
                return;


            openBinModal(binData);

        }
    );


    /* =====================
       ลากหมุด
    ===================== */

    if (adminMode) {

        let dragging = false;


        marker.addEventListener(
            "pointerdown",
            function(event) {

                event.stopPropagation();

                dragging = true;

                draggingBin = binData;

                marker.setPointerCapture(
                    event.pointerId
                );

            }
        );


        marker.addEventListener(
            "pointermove",
            function(event) {

                if (!dragging)
                    return;


                const rect =
                    wrapper.getBoundingClientRect();


                let x =
                    ((event.clientX - rect.left)
                    / rect.width) * 100;


                let y =
                    ((event.clientY - rect.top)
                    / rect.height) * 100;


                x = Math.max(
                    0,
                    Math.min(100, x)
                );


                y = Math.max(
                    0,
                    Math.min(100, y)
                );


                marker.style.left =
                    x + "%";


                marker.style.top =
                    y + "%";

            }
        );


        marker.addEventListener(
            "pointerup",
            async function(event) {

                if (!dragging)
                    return;


                dragging = false;


                const rect =
                    wrapper.getBoundingClientRect();


                let x =
                    ((event.clientX - rect.left)
                    / rect.width) * 100;


                let y =
                    ((event.clientY - rect.top)
                    / rect.height) * 100;


                x = Math.max(
                    0,
                    Math.min(100, x)
                );


                y = Math.max(
                    0,
                    Math.min(100, y)
                );


                await updatePosition(
                    binData.id,
                    x,
                    y
                );


                draggingBin = null;

            }
        );

    }


    wrapper.appendChild(marker);

}


/* =========================
   เปิดหน้าต่างแก้ไข
========================= */

function openBinModal(binData) {

    currentBin = binData;


    document
        .getElementById("binName")
        .value =
        binData.name || "ถังขยะ";


    document
        .getElementById("binStatus")
        .value =
        binData.status || "normal";


    updateStatusPreview();


    document
        .getElementById("modalBg")
        .classList.add("show");

}


/* =========================
   ปิดหน้าต่าง
========================= */

function closeModal() {

    currentBin = null;


    document
        .getElementById("modalBg")
        .classList.remove("show");

}


/* =========================
   Preview สถานะ
========================= */

document
    .getElementById("binStatus")
    .addEventListener(
        "change",
        updateStatusPreview
    );


function updateStatusPreview() {

    const status =
        document
            .getElementById("binStatus")
            .value;


    const preview =
        document
            .getElementById("statusPreview");


    preview.className =
        "status-box " +
        getStatusBoxClass(status);


    preview.textContent =
        getStatusEmoji(status)
        + " "
        + getStatusText(status);

}


/* =========================
   บันทึกถัง
========================= */

async function saveBin() {

    if (!currentBin)
        return;


    const name =
        document
            .getElementById("binName")
            .value
            .trim();


    const status =
        document
            .getElementById("binStatus")
            .value;


    if (!name) {

        alert(
            "กรุณาใส่ชื่อถังขยะ"
        );

        return;

    }


    const {
        error
    } =
    await supabaseClient
        .from("trash_bins")
        .update({

            name: name,

            status: status

        })
        .eq(
            "id",
            currentBin.id
        );


    if (error) {

        console.error(error);

        alert(
            "❌ บันทึกไม่สำเร็จ\n" +
            error.message
        );

        return;

    }


    closeModal();


    showMessage(
        "✅ บันทึกข้อมูลถังขยะแล้ว",
        "success"
    );


    loadBins();

}


/* =========================
   เปลี่ยนตำแหน่ง
========================= */

async function updatePosition(
    id,
    x,
    y
) {

    const {
        error
    } =
    await supabaseClient
        .from("trash_bins")
        .update({

            x: x,

            y: y

        })
        .eq(
            "id",
            id
        );


    if (error) {

        console.error(error);

        showMessage(
            "❌ บันทึกตำแหน่งไม่สำเร็จ",
            "error"
        );

        loadBins();

        return;

    }


    showMessage(
        "✅ บันทึกตำแหน่งใหม่แล้ว",
        "success"
    );

}


/* =========================
   ลบถัง
========================= */

async function deleteCurrentBin() {

    if (!currentBin)
        return;


    const confirmDelete =
        confirm(
            "⚠️ ต้องการลบถังขยะนี้ใช่หรือไม่?"
        );


    if (!confirmDelete)
        return;


    const {
        error
    } =
    await supabaseClient
        .from("trash_bins")
        .delete()
        .eq(
            "id",
            currentBin.id
        );


    if (error) {

        console.error(error);

        alert(
            "❌ ลบถังขยะไม่สำเร็จ\n" +
            error.message
        );

        return;

    }


    closeModal();


    showMessage(
        "🗑️ ลบถังขยะเรียบร้อย",
        "success"
    );


    loadBins();

}


/* =========================
   สถานะ
========================= */

function getStatusText(status) {

    if (status === "near_full")
        return "ใกล้เต็ม";

    if (status === "full")
        return "เต็ม";

    return "ปกติ";

}


function getStatusEmoji(status) {

    if (status === "near_full")
        return "🟡";

    if (status === "full")
        return "🔴";

    return "🟢";

}


function getStatusClass(status) {

    if (status === "near_full")
        return "near_full";

    if (status === "full")
        return "full";

    return "normal";

}


function getStatusBoxClass(status) {

    if (status === "near_full")
        return "status-near";

    if (status === "full")
        return "status-full";

    return "status-normal";

}


/* =========================
   ข้อความแจ้งเตือน
========================= */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById("message");


    message.textContent =
        text;


    message.className =
        "message show " +
        type;


    setTimeout(
        function() {

            message.className =
                "message";

        },
        3000
    );

}


/* =========================
   เริ่มต้น
========================= */

async function initialize() {

    const session =
        await checkLogin();


    if (session) {

        document
            .getElementById("adminInfo")
            .textContent =
            "👤 เจ้าหน้าที่เข้าสู่ระบบแล้ว";

    }


    loadBins();

}


initialize();

</script>

</body>

</html>
