<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>แผนที่โรงเรียน | BINCARE</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            color: #1f2937;
        }

        header {
            background: #166534;
            color: white;
            padding: 20px;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 25px 18px;
        }

        .back {
            display: inline-block;
            margin-bottom: 15px;
            color: #166534;
            text-decoration: none;
            font-weight: bold;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-btn {
            background: #16a34a;
            color: white;
        }

        .admin-btn {
            background: #1d4ed8;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            padding: 7px 10px;
            font-size: 13px;
        }

        .hint {
            background: #f0fdf4;
            color: #166534;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 15px;
            border: 2px solid #d1d5db;
            background: #eee;
        }

        #schoolMap {
            display: block;
            width: 100%;
            height: auto;
            user-select: none;
        }

        .bin {
            position: absolute;
            transform: translate(-50%, -100%);
            font-size: 30px;
            cursor: grab;
            z-index: 10;
            user-select: none;
        }

        .bin:active {
            cursor: grabbing;
        }

        .bin-label {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 30px;
            white-space: nowrap;
            background: white;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .admin-panel {
            display: none;
            background: #eff6ff;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .admin-panel.show {
            display: block;
        }

        .status-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            display: none;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">BINCARE</div>
    <div>ระบบดูแลโรงเรียน</div>
</header>

<div class="container">

    <a href="index.html" class="back">
        ← กลับหน้าหลัก
    </a>

    <div class="card">

        <h1>🗺️ แผนที่โรงเรียน</h1>

        <p class="subtitle">
            แสดงตำแหน่งถังขยะภายในโรงเรียน
        </p>

        <div class="controls">

            <button
                class="add-btn"
                id="addBinButton"
                onclick="startAddBin()">
                ➕ เพิ่มถังขยะ
            </button>

            <button
                class="admin-btn"
                id="adminButton"
                onclick="toggleAdmin()">
                🔐 โหมดแอดมิน
            </button>

        </div>

        <div id="adminPanel" class="admin-panel">

            <strong>🛠️ โหมดแอดมินเปิดอยู่</strong>

            <p style="margin-top:8px;">
                สามารถลากหมุด 🗑️ ไปยังตำแหน่งที่ถูกต้องได้
                และสามารถลบหมุดได้
            </p>

        </div>

        <div id="hint" class="hint">
            💡 กด "เพิ่มถังขยะ" แล้วกดตำแหน่งบนแผนที่
        </div>

        <div class="map-wrapper" id="mapWrapper">

            <img
                id="schoolMap"
                src="school-map.png"
                alt="แผนผังโรงเรียน">

        </div>

        <div id="message" class="status-message"></div>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://pbjeyvupzbhxodlibjuh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_paiTf1uzpiCAPR1oWQMlDg_PfVzT2p6";

let adminMode = false;
let addingBin = false;


/* =========================
   แสดงข้อความ
========================= */

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "status-message " + type;

    setTimeout(() => {
        message.className =
            "status-message";
    }, 3000);
}


/* =========================
   เปิด/ปิดโหมดแอดมิน
========================= */

function toggleAdmin() {

    adminMode = !adminMode;

    const panel =
        document.getElementById("adminPanel");

    const button =
        document.getElementById("adminButton");

    if (adminMode) {

        panel.classList.add("show");

        button.textContent =
            "🔓 ปิดโหมดแอดมิน";

        showMessage(
            "เปิดโหมดแอดมินแล้ว",
            "success"
        );

    } else {

        panel.classList.remove("show");

        button.textContent =
            "🔐 โหมดแอดมิน";

        showMessage(
            "ปิดโหมดแอดมินแล้ว",
            "success"
        );
    }

    loadBins();
}


/* =========================
   เริ่มเพิ่มถังขยะ
========================= */

function startAddBin() {

    addingBin = true;

    document.getElementById("hint").textContent =
        "📍 ตอนนี้ให้กดตำแหน่งที่ต้องการวางถังขยะบนแผนที่";

}


/* =========================
   คลิกแผนที่เพื่อเพิ่ม
========================= */

document
    .getElementById("mapWrapper")
    .addEventListener("click", async function(event) {

        if (!addingBin) return;

        if (event.target.classList.contains("bin")) {
            return;
        }

        const rect =
            this.getBoundingClientRect();

        const x =
            ((event.clientX - rect.left) / rect.width) * 100;

        const y =
            ((event.clientY - rect.top) / rect.height) * 100;

        addingBin = false;

        document.getElementById("hint").textContent =
            "💡 กด 'เพิ่มถังขยะ' แล้วกดตำแหน่งบนแผนที่";

        await addBin(x, y);

    });


/* =========================
   เพิ่มข้อมูลถังขยะ
========================= */

async function addBin(x, y) {

    try {

        const response = await fetch(
            SUPABASE_URL + "/rest/v1/trash_bins",
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " + SUPABASE_KEY,

                    "Prefer":
                        "return=representation"

                },

                body: JSON.stringify({

                    name: "ถังขยะ",
                    x: x,
                    y: y,
                    status: "normal"

                })

            }
        );

        if (!response.ok) {

            throw new Error(
                await response.text()
            );

        }

        showMessage(
            "✅ เพิ่มถังขยะเรียบร้อย",
            "success"
        );

        loadBins();

    } catch (error) {

        console.error(error);

        showMessage(
            "❌ ไม่สามารถเพิ่มถังขยะได้",
            "error"
        );

    }
}


/* =========================
   โหลดถังขยะจาก Supabase
========================= */

async function loadBins() {

    try {

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/trash_bins?select=*",
            {

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " + SUPABASE_KEY

                }

            }
        );

        if (!response.ok) {

            throw new Error(
                await response.text()
            );

        }

        const bins =
            await response.json();

        document
            .querySelectorAll(".bin")
            .forEach(bin => bin.remove());

        bins.forEach(bin => {

            createBinMarker(bin);

        });

    } catch (error) {

        console.error(error);

        showMessage(
            "❌ ไม่สามารถโหลดตำแหน่งถังขยะได้",
            "error"
        );

    }
}


/* =========================
   สร้างหมุด
========================= */

function createBinMarker(binData) {

    const wrapper =
        document.getElementById("mapWrapper");

    const marker =
        document.createElement("div");

    marker.className = "bin";

    marker.innerHTML =
        "🗑️";

    marker.style.left =
        binData.x + "%";

    marker.style.top =
        binData.y + "%";


    const label =
        document.createElement("div");

    label.className =
        "bin-label";

    label.textContent =
        binData.name || "ถังขยะ";

    marker.appendChild(label);


    /* =====================
       ลากหมุด
    ===================== */

    if (adminMode) {

        let dragging = false;

        marker.addEventListener(
            "pointerdown",
            function(event) {

                event.stopPropagation();

                dragging = true;

                marker.setPointerCapture(
                    event.pointerId
                );

            }
        );


        marker.addEventListener(
            "pointermove",
            function(event) {

                if (!dragging) return;

                const rect =
                    wrapper.getBoundingClientRect();

                let x =
                    ((event.clientX - rect.left) /
                    rect.width) * 100;

                let y =
                    ((event.clientY - rect.top) /
                    rect.height) * 100;


                x = Math.max(0, Math.min(100, x));
                y = Math.max(0, Math.min(100, y));


                marker.style.left =
                    x + "%";

                marker.style.top =
                    y + "%";

            }
        );


        marker.addEventListener(
            "pointerup",
            async function(event) {

                if (!dragging) return;

                dragging = false;

                const rect =
                    wrapper.getBoundingClientRect();

                const x =
                    ((event.clientX - rect.left) /
                    rect.width) * 100;

                const y =
                    ((event.clientY - rect.top) /
                    rect.height) * 100;

                await updateBin(
                    binData.id,
                    x,
                    y
                );

            }
        );


        /* =====================
           ดับเบิลคลิกเพื่อลบ
        ===================== */

        marker.addEventListener(
            "dblclick",
            async function(event) {

                event.stopPropagation();

                const confirmDelete =
                    confirm(
                        "ต้องการลบถังขยะนี้หรือไม่?"
                    );

                if (!confirmDelete) return;

                await deleteBin(binData.id);

            }
        );

    }

    wrapper.appendChild(marker);
}


/* =========================
   อัปเดตตำแหน่ง
========================= */

async function updateBin(id, x, y) {

    try {

        const response = await fetch(

            SUPABASE_URL +
            "/rest/v1/trash_bins?id=eq." +
            id,

            {

                method: "PATCH",

                headers: {

                    "Content-Type":
                        "application/json",

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " + SUPABASE_KEY

                },

                body: JSON.stringify({

                    x: x,
                    y: y

                })

            }

        );

        if (!response.ok) {

            throw new Error(
                await response.text()
            );

        }

        showMessage(
            "✅ บันทึกตำแหน่งใหม่แล้ว",
            "success"
        );

    } catch (error) {

        console.error(error);

        showMessage(
            "❌ บันทึกตำแหน่งไม่สำเร็จ",
            "error"
        );

        loadBins();

    }
}


/* =========================
   ลบถังขยะ
========================= */

async function deleteBin(id) {

    try {

        const response = await fetch(

            SUPABASE_URL +
            "/rest/v1/trash_bins?id=eq." +
            id,

            {

                method: "DELETE",

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " + SUPABASE_KEY

                }

            }

        );

        if (!response.ok) {

            throw new Error(
                await response.text()
            );

        }

        showMessage(
            "🗑️ ลบถังขยะแล้ว",
            "success"
        );

        loadBins();

    } catch (error) {

        console.error(error);

        showMessage(
            "❌ ไม่สามารถลบถังขยะได้",
            "error"
        );

    }
}


/* =========================
   เริ่มต้น
========================= */

loadBins();

</script>

</body>
</html>
