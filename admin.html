<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin | BINCARE</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f5;
    color: #1f2937;
}

header {
    background: #166534;
    color: white;
    padding: 20px;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.logo {
    font-size: 26px;
    font-weight: bold;
}

.logout {
    border: 0;
    background: white;
    color: #166534;
    padding: 10px 15px;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px 18px;
}

/* =========================
   TABS
========================= */

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.tab {
    border: none;
    background: white;
    color: #374151;
    padding: 13px 18px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,.06);
}

.tab.active {
    background: #166534;
    color: white;
}

/* =========================
   SECTION
========================= */

.section {
    display: none;
}

.section.active {
    display: block;
}

/* =========================
   SECTION HEADER
========================= */

.section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.section-head h2 {
    margin: 0;
}

.live {
    margin-top: 6px;
    color: #16a34a;
    font-size: 14px;
    font-weight: bold;
}

.refresh {
    border: none;
    background: white;
    padding: 10px 15px;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,.06);
}

/* =========================
   STATS
========================= */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    background: white;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.stat-number {
    font-size: 32px;
    font-weight: bold;
    margin-top: 8px;
}

.pending {
    color: #ca8a04;
}

.progress {
    color: #2563eb;
}

.resolved {
    color: #16a34a;
}

/* =========================
   CARDS
========================= */

.report,
.item-card {
    background: white;
    margin-top: 15px;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.ticket {
    color: #166534;
    font-weight: bold;
    margin-bottom: 8px;
}

.meta {
    color: #6b7280;
    margin: 8px 0;
    line-height: 1.5;
}

/* =========================
   STATUS
========================= */

.status {
    margin-top: 15px;
}

select {
    padding: 10px;
    border-radius: 9px;
    border: 1px solid #d1d5db;
    background: white;
    font-size: 15px;
}

/* =========================
   LOST FOUND
========================= */

.item-type {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
}

.type-found {
    background: #dcfce7;
    color: #166534;
}

.type-lost {
    background: #fee2e2;
    color: #991b1b;
}

.item-card h2 {
    margin: 12px 0;
}

.item-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 18px;
}

.btn {
    border: none;
    border-radius: 9px;
    padding: 11px 16px;
    font-weight: bold;
    cursor: pointer;
}

.btn-success {
    background: #16a34a;
    color: white;
}

.btn-danger {
    background: #dc2626;
    color: white;
}

.btn-secondary {
    background: #e5e7eb;
    color: #374151;
}

.btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

/* =========================
   MESSAGE
========================= */

.message {
    display: none;
    padding: 13px;
    border-radius: 10px;
    margin-bottom: 15px;
    font-weight: bold;
}

.message.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.message.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

/* =========================
   EMPTY
========================= */

.loading {
    text-align: center;
    padding: 30px;
    color: #6b7280;
}

.empty {
    background: white;
    padding: 35px;
    border-radius: 16px;
    text-align: center;
    color: #6b7280;
    margin-top: 15px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .header-inner {
        align-items: flex-start;
    }

    .item-actions {
        flex-direction: column;
    }

    .item-actions .btn {
        width: 100%;
    }

}

</style>

</head>


<body>


<header>

<div class="header-inner">

<div>

<div class="logo">
BINCARE
</div>

<div>
🛠️ ระบบจัดการสำหรับเจ้าหน้าที่
</div>

</div>


<button
class="logout"
onclick="logout()">

ออกจากระบบ

</button>

</div>

</header>


<div class="container">


<!-- =========================
     TABS
========================= -->

<div class="tabs">

<button
class="tab active"
onclick="showTab('reports', this)">

🚨 แจ้งปัญหา

</button>


<button
class="tab"
onclick="showTab('lostfound', this)">

📦 ของหาย / พบของ

</button>

</div>


<div
id="message"
class="message">
</div>


<!-- =====================================================
     REPORTS
===================================================== -->

<div
id="reportsSection"
class="section active">


<div class="section-head">

<div>

<h2>
🚨 รายการแจ้งปัญหา
</h2>

<div class="live">
🟢 Real-time
</div>

</div>


<button
class="refresh"
onclick="loadReports()">

🔄 รีเฟรช

</button>

</div>


<div class="stats">


<div class="stat">

รอตรวจสอบ

<div
id="pendingCount"
class="stat-number pending">

0

</div>

</div>


<div class="stat">

กำลังดำเนินการ

<div
id="progressCount"
class="stat-number progress">

0

</div>

</div>


<div class="stat">

แก้ไขแล้ว

<div
id="resolvedCount"
class="stat-number resolved">

0

</div>

</div>

</div>


<div id="reports">

<div class="loading">
กำลังโหลดข้อมูล...
</div>

</div>


</div>


<!-- =====================================================
     LOST FOUND
===================================================== -->

<div
id="lostfoundSection"
class="section">


<div class="section-head">

<div>

<h2>
📦 ของหาย / พบของ
</h2>

<div class="live">
🟢 Real-time
</div>

</div>


<button
class="refresh"
onclick="loadLostFound()">

🔄 รีเฟรช

</button>

</div>


<div id="lostFoundList">

<div class="loading">
กำลังโหลดข้อมูล...
</div>

</div>


</div>


</div>


<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://pbjeyvupzbhxodlibjuh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_paiTf1uzpiCAPR1oWQMlDg_PfVzT2p6";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   LOGIN
===================================================== */

async function checkLogin() {

    const {
        data: { session }
    } =
    await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href =
            "admin-login.html";

        return false;

    }


    return true;

}


/* =====================================================
   TAB
===================================================== */

function showTab(tab, button) {

    document
        .querySelectorAll(".tab")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    button.classList.add("active");


    document
        .querySelectorAll(".section")
        .forEach(section => {

            section.classList.remove("active");

        });


    if (tab === "reports") {

        document
            .getElementById("reportsSection")
            .classList.add("active");

        loadReports();

    }


    if (tab === "lostfound") {

        document
            .getElementById("lostfoundSection")
            .classList.add("active");

        loadLostFound();

    }

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text, type) {

    const box =
        document.getElementById("message");


    box.textContent = text;

    box.className =
        "message " + type;


    setTimeout(() => {

        box.className =
            "message";

    }, 4000);

}


/* =====================================================
   LOAD REPORTS
===================================================== */

async function loadReports() {

    if (!await checkLogin()) return;


    const container =
        document.getElementById("reports");


    container.innerHTML = `
        <div class="loading">
            กำลังโหลดข้อมูล...
        </div>
    `;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("reports")
        .select("*")
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">

                ❌ ไม่สามารถโหลดข้อมูลได้

                <br><br>

                ${escapeHtml(error.message)}

            </div>
        `;

        return;

    }


    let pending = 0;
    let progress = 0;
    let resolved = 0;


    data.forEach(report => {

        if (report.status === "pending")
            pending++;

        if (report.status === "in_progress")
            progress++;

        if (report.status === "resolved")
            resolved++;

    });


    document.getElementById("pendingCount")
        .textContent = pending;

    document.getElementById("progressCount")
        .textContent = progress;

    document.getElementById("resolvedCount")
        .textContent = resolved;


    if (!data || data.length === 0) {

        container.innerHTML = `
            <div class="empty">
                🎉 ยังไม่มีรายการแจ้งปัญหา
            </div>
        `;

        return;

    }


    container.innerHTML =
        data.map(report => `

        <div class="report">

            <div class="ticket">
                🎫 ${escapeHtml(report.ticket_number)}
            </div>


            <h2>
                ${escapeHtml(report.title)}
            </h2>


            <div class="meta">
                📌 หมวดหมู่:
                ${escapeHtml(report.category)}
            </div>


            <div class="meta">
                📍 สถานที่:
                ${escapeHtml(report.location)}
            </div>


            <div class="meta">
                📝 รายละเอียด:
                ${escapeHtml(report.description || "-")}
            </div>


            <div class="meta">
                📅 วันที่แจ้ง:
                ${formatDate(report.created_at)}
            </div>


            <div class="status">

                <b>สถานะ:</b>

                <select
                    onchange="updateStatus(
                        ${report.id},
                        this.value
                    )">

                    <option
                        value="pending"
                        ${report.status === "pending"
                        ? "selected" : ""}>

                        🟡 รอตรวจสอบ

                    </option>


                    <option
                        value="in_progress"
                        ${report.status === "in_progress"
                        ? "selected" : ""}>

                        🔵 กำลังดำเนินการ

                    </option>


                    <option
                        value="resolved"
                        ${report.status === "resolved"
                        ? "selected" : ""}>

                        🟢 แก้ไขแล้ว

                    </option>

                </select>

            </div>

        </div>

        `)
        .join("");

}


/* =====================================================
   UPDATE REPORT STATUS
===================================================== */

async function updateStatus(id, status) {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("reports")
        .update({

            status: status,

            updated_at:
                new Date().toISOString()

        })
        .eq("id", id)
        .select();


    if (error) {

        console.error(error);

        alert(
            "❌ ไม่สามารถเปลี่ยนสถานะได้\n\n" +
            error.message
        );

        return;

    }


    if (!data || data.length === 0) {

        alert(
            "❌ ไม่สามารถเปลี่ยนสถานะได้\n\n" +
            "ระบบไม่มีสิทธิ์แก้ไขข้อมูลรายการนี้"
        );

        return;

    }


    showMessage(
        "✅ เปลี่ยนสถานะเรียบร้อย",
        "success"
    );


    await loadReports();

}


/* =====================================================
   LOAD LOST FOUND
===================================================== */

async function loadLostFound() {

    if (!await checkLogin()) return;


    const container =
        document.getElementById("lostFoundList");


    container.innerHTML = `
        <div class="loading">
            กำลังโหลดข้อมูล...
        </div>
    `;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("lost_found")
        .select("*")
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">

                ❌ ไม่สามารถโหลดข้อมูลได้

                <br><br>

                ${escapeHtml(error.message)}

            </div>
        `;

        return;

    }


    if (!data || data.length === 0) {

        container.innerHTML = `
            <div class="empty">
                📦 ยังไม่มีรายการของหายหรือพบของ
            </div>
        `;

        return;

    }


    container.innerHTML = "";


    data.forEach(item => {

        const card =
            document.createElement("div");


        card.className =
            "item-card";


        const isFound =
            item.type === "พบของ";


        const claimed =
            item.is_claimed === true;


        card.innerHTML = `

            <div class="item-type ${
                isFound
                ? "type-found"
                : "type-lost"
            }">

                ${
                    isFound
                    ? "🟢 พบของ"
                    : "🔴 ของหาย"
                }

            </div>


            <div class="ticket">

                🎫 เลขรายการ:
                ${escapeHtml(item.ticket_number)}

            </div>


            <h2>

                📦 ${escapeHtml(item.item)}

            </h2>


            <div class="meta">

                📍 สถานที่:
                ${escapeHtml(item.location)}

            </div>


            <div class="meta">

                📝 รายละเอียด:
                ${escapeHtml(item.description || "-")}

            </div>


            <div class="meta">

                📅 วันที่แจ้ง:
                ${formatDate(item.created_at)}

            </div>


            <div class="meta">

                📌 สถานะ:

                ${
                    claimed
                    ? "✅ เจ้าของมารับแล้ว"
                    : "🟢 ยังอยู่ในระบบ"
                }

            </div>


            <div class="item-actions">


                ${
                    isFound && !claimed
                    ? `

                    <button
                        class="btn btn-success"
                        onclick="claimItem(${item.id})">

                        ✅ เจ้าของมารับแล้ว

                    </button>

                    `
                    : ""
                }


                ${
                    isFound && claimed
                    ? `

                    <button
                        class="btn btn-secondary"
                        disabled>

                        ✅ รับของเรียบร้อยแล้ว

                    </button>

                    `
                    : ""
                }


                <button
                    class="btn btn-danger"
                    onclick="deleteLostFound(${item.id})">

                    🗑️ ลบรายการ

                </button>


            </div>

        `;


        container.appendChild(card);

    });

}


/* =====================================================
   CLAIM ITEM
===================================================== */

async function claimItem(id) {

    const confirmed =
        confirm(
            "ยืนยันว่าของชิ้นนี้เจ้าของมารับแล้วใช่หรือไม่?"
        );


    if (!confirmed) return;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("lost_found")
        .update({

            is_claimed: true,

            status: "resolved"

        })
        .eq("id", id)
        .select();


    if (error) {

        console.error(error);

        alert(
            "❌ ไม่สามารถบันทึกสถานะได้\n\n" +
            error.message
        );

        return;

    }


    if (!data || data.length === 0) {

        alert(
            "❌ ไม่สามารถบันทึกสถานะได้\n\n" +
            "ระบบไม่มีสิทธิ์แก้ไขรายการนี้"
        );

        return;

    }


    showMessage(
        "✅ บันทึกว่าเจ้าของมารับแล้ว",
        "success"
    );


    await loadLostFound();

}


/* =====================================================
   DELETE LOST FOUND
===================================================== */

async function deleteLostFound(id) {

    const confirmed =
        confirm(
            "ยืนยันลบรายการนี้หรือไม่?\n\n" +
            "ข้อมูลจะถูกลบออกจากระบบ"
        );


    if (!confirmed) return;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("lost_found")
        .delete()
        .eq("id", id)
        .select();


    if (error) {

        console.error(
            "DELETE ERROR:",
            error
        );


        alert(
            "❌ ไม่สามารถลบรายการได้\n\n" +
            error.message
        );

        return;

    }


    /*
       สำคัญ:
       ถ้า data เป็น [] แสดงว่า
       Supabase ไม่ได้ลบแถวจริง
    */

    if (!data || data.length === 0) {

        alert(
            "❌ ลบรายการไม่สำเร็จ\n\n" +
            "ระบบไม่มีสิทธิ์ลบรายการนี้ " +
            "กรุณาตรวจสอบ DELETE Policy ใน Supabase"
        );

        return;

    }


    showMessage(
        "🗑️ ลบรายการเรียบร้อย",
        "success"
    );


    await loadLostFound();

}


/* =====================================================
   REAL-TIME
===================================================== */

supabaseClient
    .channel("admin-dashboard-live")


    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "reports"
        },

        function() {

            loadReports();

        }
    )


    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "lost_found"
        },

        function() {

            loadLostFound();

        }
    )


    .subscribe();


/* =====================================================
   DATE
===================================================== */

function formatDate(date) {

    if (!date) return "-";


    return new Date(date)
        .toLocaleString(
            "th-TH",
            {
                dateStyle: "medium",
                timeStyle: "short"
            }
        );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

    await supabaseClient
        .auth
        .signOut();


    window.location.href =
        "admin-login.html";

}


/* =====================================================
   START
===================================================== */

checkLogin()
    .then(loggedIn => {

        if (!loggedIn) return;

        loadReports();

    });

</script>

</body>

</html>
