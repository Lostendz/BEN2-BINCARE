<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin | BEN2 BINCARE</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans Thai", sans-serif;
    background: #f4f8ff;
    color: #172554;
}


/* =====================================================
   HEADER
===================================================== */

header {
    background: linear-gradient(
        135deg,
        #0759d7,
        #1687ff
    );

    color: white;
    padding: 18px 20px;

    box-shadow:
        0 4px 18px rgba(7, 89, 215, .25);

    border-bottom: 5px solid #ffd21f;
}

.header-inner {
    max-width: 1100px;
    margin: auto;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 15px;
}

.logo {
    font-size: 27px;
    font-weight: bold;
    letter-spacing: .5px;
}

.header-subtitle {
    margin-top: 4px;
    color: #fff4a8;
    font-weight: bold;
}


/* =====================================================
   HEADER BUTTONS
===================================================== */

.header-buttons {
    display: flex;
    gap: 10px;
    align-items: center;
}

.home-button {
    border: none;
    text-decoration: none;

    background: white;
    color: #123b8f;

    padding: 10px 15px;

    border-radius: 10px;

    font-weight: bold;
    font-size: 14px;

    transition: .2s;

    box-shadow:
        0 3px 8px rgba(0,0,0,.08);
}

.home-button:hover {
    background: #fff9d6;
    transform: translateY(-1px);
}

.logout {
    border: none;

    background: #ffd21f;
    color: #172554;

    padding: 10px 15px;

    border-radius: 10px;

    font-weight: bold;
    cursor: pointer;

    transition: .2s;
}

.logout:hover {
    background: #f5c400;
    transform: translateY(-1px);
}


/* =====================================================
   CONTAINER
===================================================== */

.container {
    max-width: 1100px;
    margin: auto;
    padding: 35px 18px 50px;
}


/* =====================================================
   TABS
===================================================== */

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.tab {
    border: 2px solid #dbeafe;

    background: white;
    color: #172554;

    padding: 13px 19px;

    border-radius: 12px;

    font-weight: bold;
    cursor: pointer;

    box-shadow:
        0 4px 12px rgba(30,64,175,.08);

    transition: .2s;
}

.tab:hover {
    transform: translateY(-1px);
}

.tab.active {
    background: #0759d7;
    color: white;
    border-color: #0759d7;

    box-shadow:
        0 4px 12px rgba(7,89,215,.25);
}


/* =====================================================
   SECTION
===================================================== */

.section {
    display: none;
}

.section.active {
    display: block;
}


/* =====================================================
   SECTION HEADER
===================================================== */

.section-head {
    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 10px;
    flex-wrap: wrap;

    margin-bottom: 15px;
}

.section-head h2 {
    margin: 0;
    color: #123b8f;
}

.live {
    margin-top: 6px;

    color: #15803d;

    font-size: 14px;
    font-weight: bold;
}

.refresh {
    border: none;

    background: white;
    color: #0759d7;

    padding: 10px 15px;

    border-radius: 10px;

    font-weight: bold;
    cursor: pointer;

    box-shadow:
        0 4px 12px rgba(30,64,175,.08);

    transition: .2s;
}

.refresh:hover {
    background: #e8f1ff;
}


/* =====================================================
   STATS
===================================================== */

.stats {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 15px;

    margin-bottom: 20px;
}

.stat {
    background: white;

    padding: 20px;

    border-radius: 17px;

    box-shadow:
        0 8px 25px rgba(30,64,175,.08);

    border: 2px solid #dbeafe;

    border-top: 5px solid #ffd21f;
}

.stat-number {
    font-size: 32px;

    font-weight: bold;

    margin-top: 8px;
}

.pending {
    color: #d97706;
}

.progress {
    color: #0759d7;
}

.resolved {
    color: #15803d;
}


/* =====================================================
   CARDS
===================================================== */

.report,
.item-card {
    background: white;

    margin-top: 15px;

    padding: 20px;

    border-radius: 17px;

    box-shadow:
        0 8px 25px rgba(30,64,175,.08);

    border: 2px solid #dbeafe;

    border-left: 5px solid #0759d7;
}

.report:hover,
.item-card:hover {
    border-color: #93c5fd;
}


/* =====================================================
   TICKET
===================================================== */

.ticket {
    color: #0759d7;

    font-weight: bold;

    margin-bottom: 8px;
}


/* =====================================================
   META
===================================================== */

.meta {
    color: #64748b;

    margin: 8px 0;

    line-height: 1.5;
}


/* =====================================================
   STATUS
===================================================== */

.status {
    margin-top: 15px;
}

select {
    padding: 10px;

    border-radius: 10px;

    border: 2px solid #dbeafe;

    background: white;

    color: #172554;

    font-size: 15px;

    outline: none;
}

select:focus {
    border-color: #0759d7;

    box-shadow:
        0 0 0 3px rgba(7,89,215,.12);
}


/* =====================================================
   LOST FOUND
===================================================== */

.item-type {
    display: inline-block;

    padding: 7px 13px;

    border-radius: 20px;

    font-size: 14px;

    font-weight: bold;
}

.type-found {
    background: #dcfce7;
    color: #166534;
}

.type-lost {
    background: #fff9d6;
    color: #765900;
}

.item-card h2 {
    margin: 12px 0;

    color: #123b8f;
}


/* =====================================================
   BUTTONS
===================================================== */

.item-actions {
    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-top: 18px;
}

.btn {
    border: none;

    border-radius: 10px;

    padding: 11px 16px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;
}

.btn:hover {
    transform: translateY(-1px);
}

.btn-success {
    background: #16a34a;
    color: white;
}

.btn-success:hover {
    background: #15803d;
}

.btn-danger {
    background: #ef4444;
    color: white;
}

.btn-danger:hover {
    background: #dc2626;
}

.btn-secondary {
    background: #e8eef6;
    color: #53647b;
}

.btn:disabled {
    opacity: .6;
    cursor: not-allowed;
    transform: none;
}


/* =====================================================
   MESSAGE
===================================================== */

.message {
    display: none;

    padding: 13px;

    border-radius: 11px;

    margin-bottom: 15px;

    font-weight: bold;
}

.message.success {
    display: block;

    background: #ecfdf5;
    color: #166534;

    border: 2px solid #86efac;
}

.message.error {
    display: block;

    background: #fff1f2;
    color: #9f1239;

    border: 2px solid #fb7185;
}


/* =====================================================
   EMPTY
===================================================== */

.loading {
    text-align: center;

    padding: 30px;

    color: #64748b;
}

.empty {
    background: white;

    padding: 35px;

    border-radius: 17px;

    text-align: center;

    color: #64748b;

    margin-top: 15px;

    border: 2px solid #dbeafe;

    box-shadow:
        0 8px 25px rgba(30,64,175,.06);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .header-inner {
        align-items: flex-start;
    }

    .header-buttons {
        flex-direction: column;
        align-items: stretch;
    }

    .home-button,
    .logout {
        padding: 9px 13px;
        white-space: nowrap;
    }

    .item-actions {
        flex-direction: column;
    }

    .item-actions .btn {
        width: 100%;
    }

}

</style>

</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
"https://pbjeyvupzbhxodlibjuh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_paiTf1uzpiCAPR1oWQMlDg_PfVzT2p6";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   LOGIN
===================================================== */

async function checkLogin() {

    const {
        data: { session }
    } =
    await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href =
            "admin-login.html";

        return false;

    }


    return true;

}


/* =====================================================
   TAB
===================================================== */

function showTab(tab, button) {

    document
        .querySelectorAll(".tab")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    button.classList.add("active");


    document
        .querySelectorAll(".section")
        .forEach(section => {

            section.classList.remove("active");

        });


    if (tab === "reports") {

        document
            .getElementById("reportsSection")
            .classList.add("active");

        loadReports();

    }


    if (tab === "lostfound") {

        document
            .getElementById("lostfoundSection")
            .classList.add("active");

        loadLostFound();

    }

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text, type) {

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className =
        "message " + type;

    setTimeout(() => {

        box.className =
            "message";

    }, 4000);

}


/* =====================================================
   LOAD REPORTS
===================================================== */

async function loadReports() {

    if (!await checkLogin()) return;

    const container =
        document.getElementById("reports");

    container.innerHTML = `
        <div class="loading">
            กำลังโหลดข้อมูล...
        </div>
    `;

    const {
        data,
        error
    } =
    await supabaseClient
        .from("reports")
        .select("*")
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">

                ❌ ไม่สามารถโหลดข้อมูลได้

                <br><br>

                ${escapeHtml(error.message)}

            </div>
        `;

        return;

    }


    let pending = 0;
    let progress = 0;
    let resolved = 0;


    data.forEach(report => {

        if (report.status === "pending")
            pending++;

        if (report.status === "in_progress")
            progress++;

        if (report.status === "resolved")
            resolved++;

    });


    document.getElementById("pendingCount")
        .textContent = pending;

    document.getElementById("progressCount")
        .textContent = progress;

    document.getElementById("resolvedCount")
        .textContent = resolved;


    if (!data || data.length === 0) {

        container.innerHTML = `
            <div class="empty">
                🎉 ยังไม่มีรายการแจ้งปัญหา
            </div>
        `;

        return;

    }


    container.innerHTML =
        data.map(report => `

        <div class="report">

            <div class="ticket">
                🎫 ${escapeHtml(report.ticket_number)}
            </div>

            <h2>
                ${escapeHtml(report.title)}
            </h2>

            <div class="meta">
                📌 หมวดหมู่:
                ${escapeHtml(report.category)}
            </div>

            <div class="meta">
                📍 สถานที่:
                ${escapeHtml(report.location)}
            </div>

            <div class="meta">
                📝 รายละเอียด:
                ${escapeHtml(report.description || "-")}
            </div>

            <div class="meta">
                📅 วันที่แจ้ง:
                ${formatDate(report.created_at)}
            </div>

            <div class="status">

                <b>สถานะ:</b>

                <select
                    onchange="updateStatus(
                        ${report.id},
                        this.value
                    )">

                    <option
                        value="pending"
                        ${report.status === "pending"
                        ? "selected" : ""}>

                        🟡 รอตรวจสอบ

                    </option>

                    <option
                        value="in_progress"
                        ${report.status === "in_progress"
                        ? "selected" : ""}>

                        🔵 กำลังดำเนินการ

                    </option>

                    <option
                        value="resolved"
                        ${report.status === "resolved"
                        ? "selected" : ""}>

                        🟢 แก้ไขแล้ว

                    </option>

                </select>

            </div>

        </div>

        `)
        .join("");

}


/* =====================================================
   UPDATE REPORT STATUS
===================================================== */

async function updateStatus(id, status) {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("reports")
        .update({

            status: status,

            updated_at:
                new Date().toISOString()

        })
        .eq("id", id)
        .select();


    if (error) {

        console.error(error);

        alert(
            "❌ ไม่สามารถเปลี่ยนสถานะได้\n\n" +
            error.message
        );

        return;

    }


    if (!data || data.length === 0) {

        alert(
            "❌ ไม่สามารถเปลี่ยนสถานะได้\n\n" +
            "ระบบไม่มีสิทธิ์แก้ไขข้อมูลรายการนี้"
        );

        return;

    }


    showMessage(
        "✅ เปลี่ยนสถานะเรียบร้อย",
        "success"
    );

    await loadReports();

}


/* =====================================================
   LOAD LOST FOUND
===================================================== */

async function loadLostFound() {

    if (!await checkLogin()) return;

    const container =
        document.getElementById("lostFoundList");

    container.innerHTML = `
        <div class="loading">
            กำลังโหลดข้อมูล...
        </div>
    `;

    const {
        data,
        error
    } =
    await supabaseClient
        .from("lost_found")
        .select("*")
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">

                ❌ ไม่สามารถโหลดข้อมูลได้

                <br><br>

                ${escapeHtml(error.message)}

            </div>
        `;

        return;

    }


    if (!data || data.length === 0) {

        container.innerHTML = `
            <div class="empty">
                📦 ยังไม่มีรายการของหายหรือพบของ
            </div>
        `;

        return;

    }


    container.innerHTML = "";


    data.forEach(item => {

        const card =
            document.createElement("div");

        card.className =
            "item-card";


        const isFound =
            item.type === "พบของ";

        const claimed =
            item.is_claimed === true;


        card.innerHTML = `

            <div class="item-type ${
                isFound
                ? "type-found"
                : "type-lost"
            }">

                ${
                    isFound
                    ? "🟢 พบของ"
                    : "🔴 ของหาย"
                }

            </div>


            <div class="ticket">

                🎫 เลขรายการ:
                ${escapeHtml(item.ticket_number)}

            </div>


            <h2>

                📦 ${escapeHtml(item.item)}

            </h2>


            <div class="meta">

                📍 สถานที่:
                ${escapeHtml(item.location)}

            </div>


            <div class="meta">

                📝 รายละเอียด:
                ${escapeHtml(item.description || "-")}

            </div>


            <div class="meta">

                📅 วันที่แจ้ง:
                ${formatDate(item.created_at)}

            </div>


            <div class="meta">

                📌 สถานะ:

                ${
                    claimed
                    ? "✅ เจ้าของมารับแล้ว"
                    : "🟢 ยังอยู่ในระบบ"
                }

            </div>


            <div class="item-actions">

                ${
                    isFound && !claimed
                    ? `

                    <button
                        class="btn btn-success"
                        onclick="claimItem(${item.id})">

                        ✅ เจ้าของมารับแล้ว

                    </button>

                    `
                    : ""
                }


                ${
                    isFound && claimed
                    ? `

                    <button
                        class="btn btn-secondary"
                        disabled>

                        ✅ รับของเรียบร้อยแล้ว

                    </button>

                    `
                    : ""
                }


                <button
                    class="btn btn-danger"
                    onclick="deleteLostFound(${item.id})">

                    🗑️ ลบรายการ

                </button>

            </div>

        `;

        container.appendChild(card);

    });

}


/* =====================================================
   CLAIM ITEM
===================================================== */

async function claimItem(id) {

    const confirmed =
        confirm(
            "ยืนยันว่าของชิ้นนี้เจ้าของมารับแล้วใช่หรือไม่?"
        );

    if (!confirmed) return;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("lost_found")
        .update({

            is_claimed: true,

            status: "resolved"

        })
        .eq("id", id)
        .select();


    if (error) {

        console.error(error);

        alert(
            "❌ ไม่สามารถบันทึกสถานะได้\n\n" +
            error.message
        );

        return;

    }


    if (!data || data.length === 0) {

        alert(
            "❌ ไม่สามารถบันทึกสถานะได้\n\n" +
            "ระบบไม่มีสิทธิ์แก้ไขรายการนี้"
        );

        return;

    }


    showMessage(
        "✅ บันทึกว่าเจ้าของมารับแล้ว",
        "success"
    );

    await loadLostFound();

}


/* =====================================================
   DELETE LOST FOUND
===================================================== */

async function deleteLostFound(id) {

    const confirmed =
        confirm(
            "ยืนยันลบรายการนี้หรือไม่?\n\n" +
            "ข้อมูลจะถูกลบออกจากระบบ"
        );

    if (!confirmed) return;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("lost_found")
        .delete()
        .eq("id", id)
        .select();


    if (error) {

        console.error(
            "DELETE ERROR:",
            error
        );

        alert(
            "❌ ไม่สามารถลบรายการได้\n\n" +
            error.message
        );

        return;

    }


    if (!data || data.length === 0) {

        alert(
            "❌ ลบรายการไม่สำเร็จ\n\n" +
            "ระบบไม่มีสิทธิ์ลบรายการนี้ " +
            "กรุณาตรวจสอบ DELETE Policy ใน Supabase"
        );

        return;

    }


    showMessage(
        "🗑️ ลบรายการเรียบร้อย",
        "success"
    );

    await loadLostFound();

}


/* =====================================================
   REAL-TIME
===================================================== */

supabaseClient
    .channel("admin-dashboard-live")

    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "reports"
        },

        function() {
            loadReports();
        }
    )

    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "lost_found"
        },

        function() {
            loadLostFound();
        }
    )

    .subscribe();


/* =====================================================
   DATE
===================================================== */

function formatDate(date) {

    if (!date) return "-";

    return new Date(date)
        .toLocaleString(
            "th-TH",
            {
                dateStyle: "medium",
                timeStyle: "short"
            }
        );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)

        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

    await supabaseClient
        .auth
        .signOut();

    window.location.href =
        "admin-login.html";

}


/* =====================================================
   START
===================================================== */

checkLogin()
    .then(loggedIn => {

        if (!loggedIn) return;

        loadReports();

    });
