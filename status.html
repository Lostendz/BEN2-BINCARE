<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ตรวจสอบสถานะ | BINCARE</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7f5;
    color: #1f2937;
}

header {
    background: #166534;
    color: white;
    padding: 20px;
}

.logo {
    font-size: 26px;
    font-weight: bold;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 25px 18px;
}

.back {
    display: inline-block;
    margin-bottom: 15px;
    color: #166534;
    text-decoration: none;
    font-weight: bold;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h1 {
    margin-bottom: 8px;
}

.subtitle {
    color: #6b7280;
    margin-bottom: 25px;
    line-height: 1.5;
}

.search-box {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
}

button {
    border: none;
    background: #16a34a;
    color: white;
    padding: 14px 20px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #15803d;
}

.result {
    display: none;
    margin-top: 25px;
    border-top: 1px solid #e5e7eb;
    padding-top: 25px;
}

.result.show {
    display: block;
}

.result-card {
    border: 1px solid #e5e7eb;
    border-radius: 15px;
    padding: 20px;
}

.type {
    display: inline-block;
    background: #ecfdf5;
    color: #166534;
    padding: 7px 12px;
    border-radius: 20px;
    font-weight: bold;
    margin-bottom: 12px;
}

.ticket {
    font-size: 22px;
    font-weight: bold;
    color: #166534;
    margin-bottom: 15px;
}

.info {
    margin: 10px 0;
    line-height: 1.5;
}

.status {
    display: inline-block;
    margin-top: 15px;
    padding: 9px 15px;
    border-radius: 20px;
    font-weight: bold;
}

.pending {
    background: #fef3c7;
    color: #92400e;
}

.in_progress {
    background: #dbeafe;
    color: #1d4ed8;
}

.resolved {
    background: #dcfce7;
    color: #166534;
}

.not-found {
    display: none;
    margin-top: 25px;
    padding: 18px;
    border-radius: 12px;
    background: #fee2e2;
    color: #991b1b;
}

.loading {
    display: none;
    margin-top: 20px;
    text-align: center;
    color: #6b7280;
}

@media(max-width:600px) {

    .search-box {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

}

</style>

</head>


<body>

<header>

<div class="logo">
BINCARE
</div>

<div>
ระบบตรวจสอบสถานะ
</div>

</header>


<div class="container">

<a href="index.html" class="back">
← กลับหน้าหลัก
</a>


<div class="card">

<h1>🔎 ตรวจสอบสถานะรายการ</h1>

<p class="subtitle">
กรอกหมายเลขรายการที่ได้รับหลังจากแจ้งปัญหา
หรือแจ้งของหาย / พบของ
</p>


<div class="search-box">

<input
id="ticketInput"
type="text"
placeholder="เช่น LOST-745003 หรือ REPORT-123456"
autocomplete="off"
>

<button onclick="searchTicket()">
🔍 ตรวจสอบ
</button>

</div>


<div id="loading" class="loading">
กำลังค้นหาข้อมูล...
</div>


<div id="notFound" class="not-found">
❌ ไม่พบหมายเลขรายการนี้
<br>
กรุณาตรวจสอบหมายเลขอีกครั้ง
</div>


<div id="result" class="result">

<div class="result-card">

<div id="type" class="type">
</div>

<div id="ticket" class="ticket">
</div>

<div id="details">
</div>

<div id="status">
</div>

</div>

</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://pbjeyvupzbhxodlibjuh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_paiTf1uzpiCAPR1oWQMlDg_PfVzT2p6";


async function searchTicket() {

    const input =
        document.getElementById("ticketInput");

    const ticket =
        input.value.trim().toUpperCase();


    const result =
        document.getElementById("result");

    const notFound =
        document.getElementById("notFound");

    const loading =
        document.getElementById("loading");


    result.classList.remove("show");
    notFound.style.display = "none";


    if (!ticket) {

        notFound.innerHTML =
            "⚠️ กรุณากรอกหมายเลขรายการ";

        notFound.style.display = "block";

        return;
    }


    loading.style.display = "block";


    try {

        /* =========================
           ค้นหาแจ้งปัญหา
        ========================= */

        const reportResponse =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/reports?ticket_number=eq." +
                encodeURIComponent(ticket) +
                "&select=*",
                {

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }
            );


        const reports =
            await reportResponse.json();


        if (
            Array.isArray(reports) &&
            reports.length > 0
        ) {

            showReport(reports[0]);

            loading.style.display = "none";

            return;
        }


        /* =========================
           ค้นหาของหาย / พบของ
        ========================= */

        const lostResponse =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/lost_found?ticket_number=eq." +
                encodeURIComponent(ticket) +
                "&select=*",
                {

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }
            );


        const lostFound =
            await lostResponse.json();


        if (
            Array.isArray(lostFound) &&
            lostFound.length > 0
        ) {

            showLostFound(lostFound[0]);

            loading.style.display = "none";

            return;
        }


        loading.style.display = "none";

        notFound.innerHTML =
            "❌ ไม่พบหมายเลขรายการนี้<br>" +
            "กรุณาตรวจสอบหมายเลขอีกครั้ง";

        notFound.style.display = "block";


    } catch (error) {

        console.error(error);

        loading.style.display = "none";

        notFound.innerHTML =
            "❌ เกิดข้อผิดพลาดในการค้นหา<br>" +
            "กรุณาลองใหม่อีกครั้ง";

        notFound.style.display = "block";

    }

}


/* =========================
   แสดงแจ้งปัญหา
========================= */

function showReport(report) {

    document.getElementById("type").textContent =
        "🚨 แจ้งปัญหา";


    document.getElementById("ticket").textContent =
        report.ticket_number;


    document.getElementById("details").innerHTML = `

        <div class="info">
            📌 <b>หัวข้อ:</b>
            ${escapeHtml(report.title)}
        </div>

        <div class="info">
            📂 <b>ประเภท:</b>
            ${escapeHtml(report.category)}
        </div>

        <div class="info">
            📍 <b>สถานที่:</b>
            ${escapeHtml(report.location)}
        </div>

        <div class="info">
            📝 <b>รายละเอียด:</b><br>
            ${escapeHtml(
                report.description || "-"
            )}
        </div>

    `;


    showStatus(report.status);

}


/* =========================
   แสดงของหาย / พบของ
========================= */

function showLostFound(item) {

    document.getElementById("type").textContent =
        item.type === "ของหาย"
        ? "🔴 ของหาย"
        : "🟢 พบของ";


    document.getElementById("ticket").textContent =
        item.ticket_number;


    document.getElementById("details").innerHTML = `

        <div class="info">
            📦 <b>สิ่งของ:</b>
            ${escapeHtml(item.item)}
        </div>

        <div class="info">
            📍 <b>สถานที่:</b>
            ${escapeHtml(item.location)}
        </div>

        <div class="info">
            📝 <b>รายละเอียด:</b><br>
            ${escapeHtml(
                item.description || "-"
            )}
        </div>

    `;


    showStatus(item.status);

}


/* =========================
   แสดงสถานะ
========================= */

function showStatus(status) {

    const statusElement =
        document.getElementById("status");


    const statusClass =
        status || "pending";


    const statusText = {

        pending:
            "🟡 รอตรวจสอบ",

        in_progress:
            "🔵 กำลังดำเนินการ",

        resolved:
            "🟢 ดำเนินการเรียบร้อย"

    };


    statusElement.className =
        "status " + statusClass;


    statusElement.textContent =
        statusText[statusClass] ||
        statusClass;


    document
        .getElementById("result")
        .classList.add("show");

}


/* =========================
   ป้องกัน HTML
========================= */

function escapeHtml(value) {

    if (!value) return "";

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================
   กด Enter เพื่อค้นหา
========================= */

document
    .getElementById("ticketInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                searchTicket();

            }

        }
    );

</script>

</body>

</html>
