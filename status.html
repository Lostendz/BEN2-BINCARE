<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ตรวจสอบสถานะ | BEN2 BINCARE</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

/* =====================================================
   THEME — ให้เหมือน index.html
===================================================== */

:root {

    --blue: #0759d7;
    --blue-dark: #123b8f;
    --blue-light: #e8f1ff;

    --yellow: #ffd21f;
    --yellow-light: #fff9d6;

    --text: #172554;
    --muted: #64748b;

    --bg: #f4f8ff;
    --white: #ffffff;

    --border: #dbeafe;

}

/* =====================================================
   BODY
===================================================== */

body {

    font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

    background: #f4f8ff;

    color: var(--text);

    min-height: 100vh;

}

/* =====================================================
   HEADER
===================================================== */

header {

    background:
        linear-gradient(
            135deg,
            #0759d7,
            #1687ff
        );

    color: white;

    padding: 18px 20px;

    box-shadow:
        0 4px 18px rgba(7, 89, 215, .25);

    border-bottom: 5px solid #ffd21f;

}

.logo {

    font-size: 26px;

    font-weight: bold;

    letter-spacing: .5px;

}

header div:last-child {

    margin-top: 3px;

    color: #fff4a8;

    font-weight: bold;

}

/* =====================================================
   CONTAINER
===================================================== */

.container {

    max-width: 700px;

    margin: auto;

    padding: 35px 18px 50px;

}

/* =====================================================
   BACK
===================================================== */

.back {

    display: inline-flex;

    align-items: center;

    gap: 5px;

    margin-bottom: 18px;

    color: #0759d7;

    text-decoration: none;

    font-weight: bold;

    background: white;

    padding: 9px 14px;

    border-radius: 10px;

    box-shadow:
        0 3px 10px rgba(30,64,175,.08);

    transition: .2s;

}

.back:hover {

    background: #e8f1ff;

    transform: translateX(-3px);

}

/* =====================================================
   CARD
===================================================== */

.card {

    background: white;

    border-radius: 24px;

    padding: 30px;

    border: 2px solid #dbeafe;

    box-shadow:
        0 12px 35px rgba(30,64,175,.10);

}

/* =====================================================
   TITLE
===================================================== */

h1 {

    margin-bottom: 8px;

    color: #123b8f;

}

.subtitle {

    color: #64748b;

    margin-bottom: 25px;

    line-height: 1.6;

}

/* =====================================================
   SEARCH
===================================================== */

.search-box {

    display: flex;

    gap: 10px;

}

input {

    flex: 1;

    padding: 14px;

    border: 2px solid #dbeafe;

    border-radius: 12px;

    font-size: 16px;

    outline: none;

    background: #f8fbff;

    color: #172554;

}

input:focus {

    border-color: #0759d7;

    background: white;

    box-shadow:
        0 0 0 4px rgba(7,89,215,.10);

}

/* =====================================================
   BUTTON
===================================================== */

button {

    border: none;

    background:
        linear-gradient(
            135deg,
            #ffd21f,
            #f5b800
        );

    color: #172554;

    padding: 14px 20px;

    border-radius: 12px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 5px 14px rgba(245,184,0,.22);

    transition: .2s;

}

button:hover {

    background:
        linear-gradient(
            135deg,
            #ffd21f,
            #eab000
        );

    transform: translateY(-2px);

    box-shadow:
        0 8px 20px rgba(245,184,0,.30);

}

button:disabled {

    background: #cbd5e1;

    color: #64748b;

    cursor: not-allowed;

    box-shadow: none;

    transform: none;

}

/* =====================================================
   RESULT
===================================================== */

.result {

    display: none;

    margin-top: 25px;

    border-top: 2px solid #dbeafe;

    padding-top: 25px;

}

.result.show {

    display: block;

}

.result-card {

    border: 2px solid #dbeafe;

    border-radius: 18px;

    padding: 20px;

    background: white;

    box-shadow:
        0 6px 20px rgba(30,64,175,.06);

}

/* =====================================================
   TYPE
===================================================== */

.type {

    display: inline-block;

    background: #fff9d6;

    color: #765900;

    padding: 7px 12px;

    border-radius: 20px;

    font-weight: bold;

    margin-bottom: 12px;

    border: 1px solid #ffe066;

}

/* =====================================================
   TICKET
===================================================== */

.ticket {

    font-size: 22px;

    font-weight: bold;

    color: #123b8f;

    margin-bottom: 15px;

}

/* =====================================================
   INFO
===================================================== */

.info {

    margin: 10px 0;

    line-height: 1.5;

    color: #172554;

}

.info b {

    color: #123b8f;

}

/* =====================================================
   STATUS
===================================================== */

.status {

    display: inline-block;

    margin-top: 15px;

    padding: 9px 15px;

    border-radius: 20px;

    font-weight: bold;

}

.pending {

    background: #fff9d6;

    color: #765900;

}

.in_progress {

    background: #e8f1ff;

    color: #0759d7;

}

.resolved {

    background: #dcfce7;

    color: #166534;

}

.claimed {

    background: #dcfce7;

    color: #166534;

}

/* =====================================================
   NOT FOUND
===================================================== */

.not-found {

    display: none;

    margin-top: 25px;

    padding: 18px;

    border-radius: 12px;

    background: #fff1f2;

    border: 2px solid #fb7185;

    color: #9f1239;

    line-height: 1.6;

}

/* =====================================================
   LOADING
===================================================== */

.loading {

    display: none;

    margin-top: 20px;

    text-align: center;

    color: #64748b;

}

/* =====================================================
   HINT
===================================================== */

.hint {

    margin-top: 15px;

    padding: 12px;

    border-radius: 10px;

    background: #e8f1ff;

    border: 1px solid #b8d5ff;

    color: #123b8f;

    font-size: 14px;

    line-height: 1.5;

}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px) {

    header {

        padding: 19px 17px;

    }

    .logo {

        font-size: 25px;

    }

    .container {

        padding: 20px 14px 35px;

    }

    .card {

        padding: 22px;

        border-radius: 20px;

    }

    .search-box {

        flex-direction: column;

    }

    button {

        width: 100%;

    }

}

</style>

</head>

<body>

<header>

<div class="logo">
BEN2 BINCARE
</div>

<div>
ระบบตรวจสอบสถานะ
</div>

</header>

<div class="container">

<a href="index.html" class="back">
← กลับหน้าหลัก
</a>

<div class="card">

<h1>
🔎 ตรวจสอบสถานะรายการ
</h1>

<p class="subtitle">

กรอกหมายเลขรายการที่ได้รับหลังจาก
แจ้งปัญหา หรือแจ้งของหาย / พบของ

</p>

<div class="search-box">

<input
id="ticketInput"
type="text"
placeholder="เช่น LOST-745003 หรือ REPORT-123456"
autocomplete="off"
>

<button
id="searchButton"
onclick="searchTicket">

🔍 ตรวจสอบ

</button>

</div>

<div class="hint">

💡 ตัวอย่างหมายเลขรายการ:
<strong>LOST-345018</strong>
หรือ
<strong>REPORT-123456</strong>

</div>

<div
id="loading"
class="loading">

กำลังค้นหาข้อมูล...

</div>

<div
id="notFound"
class="not-found">

❌ ไม่พบหมายเลขรายการนี้
<br>
กรุณาตรวจสอบหมายเลขอีกครั้ง

</div>

<div
id="result"
class="result">

<div class="result-card">

<div
id="type"
class="type">
</div>

<div
id="ticket"
class="ticket">
</div>

<div id="details">
</div>

<div id="status">
</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://pbjeyvupzbhxodlibjuh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_paiTf1uzpiCAPR1oWQMlDg_PfVzT2p6";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function searchTicket() {

    const input =
        document.getElementById("ticketInput");

    const button =
        document.getElementById("searchButton");

    const ticket =
        input.value
            .trim()
            .toUpperCase();

    const result =
        document.getElementById("result");

    const notFound =
        document.getElementById("notFound");

    const loading =
        document.getElementById("loading");

    result.classList.remove("show");

    notFound.style.display = "none";

    if (!ticket) {

        notFound.innerHTML =
            "⚠️ กรุณากรอกหมายเลขรายการ";

        notFound.style.display =
            "block";

        input.focus();

        return;

    }

    loading.style.display =
        "block";

    button.disabled = true;

    button.textContent =
        "กำลังค้นหา...";

    try {

        const {
            data: reports,
            error: reportError
        } =
        await supabaseClient
            .from("reports")
            .select("*")
            .eq(
                "ticket_number",
                ticket
            )
            .limit(1);

        if (reportError) {

            console.error(
                "Report Error:",
                reportError
            );

        }

        if (
            reports &&
            reports.length > 0
        ) {

            showReport(
                reports[0]
            );

            return;

        }

        const {
            data: lostFound,
            error: lostError
        } =
        await supabaseClient
            .from("lost_found")
            .select("*")
            .eq(
                "ticket_number",
                ticket
            )
            .limit(1);

        if (lostError) {

            console.error(
                "Lost Found Error:",
                lostError
            );

        }

        if (
            lostFound &&
            lostFound.length > 0
        ) {

            showLostFound(
                lostFound[0]
            );

            return;

        }

        notFound.innerHTML = `
            ❌ ไม่พบหมายเลขรายการนี้
            <br>
            กรุณาตรวจสอบหมายเลขอีกครั้ง
        `;

        notFound.style.display =
            "block";

    } catch (error) {

        console.error(error);

        notFound.innerHTML = `
            ❌ เกิดข้อผิดพลาดในการค้นหา
            <br>
            กรุณาลองใหม่อีกครั้ง
        `;

        notFound.style.display =
            "block";

    }

    finally {

        loading.style.display =
            "none";

        button.disabled =
            false;

        button.textContent =
            "🔍 ตรวจสอบ";

    }

}

function showReport(report) {

    document
        .getElementById("type")
        .textContent =
            "🚨 แจ้งปัญหา";

    document
        .getElementById("ticket")
        .textContent =
            report.ticket_number;

    document
        .getElementById("details")
        .innerHTML = `

        <div class="info">

            📌 <b>หัวข้อ:</b>
            ${escapeHtml(
                report.title
            )}

        </div>

        <div class="info">

            📂 <b>ประเภท:</b>
            ${escapeHtml(
                report.category
            )}

        </div>

        <div class="info">

            📍 <b>สถานที่:</b>
            ${escapeHtml(
                report.location
            )}

        </div>

        <div class="info">

            📝 <b>รายละเอียด:</b>
            <br>

            ${escapeHtml(
                report.description || "-"
            )}

        </div>

    `;

    showStatus(
        report.status
    );

}

function showLostFound(item) {

    const isLost =
        item.type === "ของหาย";

    document
        .getElementById("type")
        .textContent =
            isLost
            ? "🔴 ของหาย"
            : "🟢 พบของ";

    document
        .getElementById("ticket")
        .textContent =
            item.ticket_number;

    document
        .getElementById("details")
        .innerHTML = `

        <div class="info">

            📦 <b>สิ่งของ:</b>
            ${escapeHtml(
                item.item
            )}

        </div>

        <div class="info">

            📍 <b>สถานที่:</b>
            ${escapeHtml(
                item.location
            )}

        </div>

        <div class="info">

            📝 <b>รายละเอียด:</b>
            <br>

            ${escapeHtml(
                item.description || "-"
            )}

        </div>

    `;

    if (
        item.is_claimed === true
    ) {

        showClaimedStatus();

        return;

    }

    showStatus(
        item.status
    );

}

function showStatus(status) {

    const statusElement =
        document.getElementById(
            "status"
        );

    const statusClass =
        status || "pending";

    const statusText = {

        pending:
            "🟡 รอตรวจสอบ",

        in_progress:
            "🔵 กำลังดำเนินการ",

        resolved:
            "🟢 ดำเนินการเรียบร้อย"

    };

    statusElement.className =
        "status " +
        statusClass;

    statusElement.textContent =
        statusText[statusClass] ||
        "📌 " + statusClass;

    document
        .getElementById("result")
        .classList.add("show");

}

function showClaimedStatus() {

    const statusElement =
        document.getElementById(
            "status"
        );

    statusElement.className =
        "status claimed";

    statusElement.textContent =
        "✅ เจ้าของมารับของแล้ว";

    document
        .getElementById("result")
        .classList.add("show");

}

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

document
    .getElementById(
        "ticketInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                searchTicket();

            }

        }
    );

</script>

</body>

</html>
