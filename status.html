<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ตรวจสอบสถานะ | BEN2 BINCARE</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7f5;
    color: #1f2937;
}

header {
    background: #166534;
    color: white;
    padding: 20px;
}

.logo {
    font-size: 26px;
    font-weight: bold;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 25px 18px;
}

.back {
    display: inline-block;
    margin-bottom: 15px;
    color: #166534;
    text-decoration: none;
    font-weight: bold;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h1 {
    margin-bottom: 8px;
}

.subtitle {
    color: #6b7280;
    margin-bottom: 25px;
    line-height: 1.5;
}

.search-box {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #16a34a;
}

button {
    border: none;
    background: #16a34a;
    color: white;
    padding: 14px 20px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #15803d;
}

button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

.result {
    display: none;
    margin-top: 25px;
    border-top: 1px solid #e5e7eb;
    padding-top: 25px;
}

.result.show {
    display: block;
}

.result-card {
    border: 1px solid #e5e7eb;
    border-radius: 15px;
    padding: 20px;
}

.type {
    display: inline-block;
    background: #ecfdf5;
    color: #166534;
    padding: 7px 12px;
    border-radius: 20px;
    font-weight: bold;
    margin-bottom: 12px;
}

.ticket {
    font-size: 22px;
    font-weight: bold;
    color: #166534;
    margin-bottom: 15px;
}

.info {
    margin: 10px 0;
    line-height: 1.5;
}

.status {
    display: inline-block;
    margin-top: 15px;
    padding: 9px 15px;
    border-radius: 20px;
    font-weight: bold;
}

.pending {
    background: #fef3c7;
    color: #92400e;
}

.in_progress {
    background: #dbeafe;
    color: #1d4ed8;
}

.resolved {
    background: #dcfce7;
    color: #166534;
}

.claimed {
    background: #dcfce7;
    color: #166534;
}

.not-found {
    display: none;
    margin-top: 25px;
    padding: 18px;
    border-radius: 12px;
    background: #fee2e2;
    color: #991b1b;
    line-height: 1.6;
}

.loading {
    display: none;
    margin-top: 20px;
    text-align: center;
    color: #6b7280;
}

.hint {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    background: #f0fdf4;
    color: #166534;
    font-size: 14px;
    line-height: 1.5;
}

@media(max-width:600px) {

    .search-box {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

}

</style>

</head>


<body>

<header>

<div class="logo">
BINCARE
</div>

<div>
ระบบตรวจสอบสถานะ
</div>

</header>


<div class="container">

<a href="index.html" class="back">
← กลับหน้าหลัก
</a>


<div class="card">

<h1>
🔎 ตรวจสอบสถานะรายการ
</h1>


<p class="subtitle">

กรอกหมายเลขรายการที่ได้รับหลังจาก
แจ้งปัญหา หรือแจ้งของหาย / พบของ

</p>


<div class="search-box">

<input
id="ticketInput"
type="text"
placeholder="เช่น LOST-745003 หรือ REPORT-123456"
autocomplete="off"
>

<button
id="searchButton"
onclick="searchTicket()">

🔍 ตรวจสอบ

</button>

</div>


<div class="hint">

💡 ตัวอย่างหมายเลขรายการ:
<strong>LOST-345018</strong>
หรือ
<strong>REPORT-123456</strong>

</div>


<div
id="loading"
class="loading">

กำลังค้นหาข้อมูล...

</div>


<div
id="notFound"
class="not-found">

❌ ไม่พบหมายเลขรายการนี้
<br>
กรุณาตรวจสอบหมายเลขอีกครั้ง

</div>


<div
id="result"
class="result">

<div class="result-card">

<div
id="type"
class="type">
</div>


<div
id="ticket"
class="ticket">
</div>


<div id="details">
</div>


<div id="status">
</div>

</div>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://pbjeyvupzbhxodlibjuh.supabase.co";


const SUPABASE_KEY =
"sb_publishable_paiTf1uzpiCAPR1oWQMlDg_PfVzT2p6";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   SEARCH
===================================================== */

async function searchTicket() {

    const input =
        document.getElementById("ticketInput");


    const button =
        document.getElementById("searchButton");


    const ticket =
        input.value
            .trim()
            .toUpperCase();


    const result =
        document.getElementById("result");


    const notFound =
        document.getElementById("notFound");


    const loading =
        document.getElementById("loading");


    /* ซ่อนผลเดิม */

    result.classList.remove("show");

    notFound.style.display = "none";


    /* ตรวจสอบช่องว่าง */

    if (!ticket) {

        notFound.innerHTML =
            "⚠️ กรุณากรอกหมายเลขรายการ";

        notFound.style.display =
            "block";

        input.focus();

        return;

    }


    loading.style.display =
        "block";


    button.disabled = true;

    button.textContent =
        "กำลังค้นหา...";


    try {

        /* =================================================
           ค้นหา REPORTS
        ================================================= */

        const {
            data: reports,
            error: reportError
        } =
        await supabaseClient
            .from("reports")
            .select("*")
            .eq(
                "ticket_number",
                ticket
            )
            .limit(1);


        if (reportError) {

            console.error(
                "Report Error:",
                reportError
            );

        }


        if (
            reports &&
            reports.length > 0
        ) {

            showReport(
                reports[0]
            );

            return;

        }


        /* =================================================
           ค้นหา LOST FOUND
        ================================================= */

        const {
            data: lostFound,
            error: lostError
        } =
        await supabaseClient
            .from("lost_found")
            .select("*")
            .eq(
                "ticket_number",
                ticket
            )
            .limit(1);


        if (lostError) {

            console.error(
                "Lost Found Error:",
                lostError
            );

        }


        if (
            lostFound &&
            lostFound.length > 0
        ) {

            showLostFound(
                lostFound[0]
            );

            return;

        }


        /* =================================================
           ไม่พบข้อมูล
        ================================================= */

        notFound.innerHTML = `
            ❌ ไม่พบหมายเลขรายการนี้
            <br>
            กรุณาตรวจสอบหมายเลขอีกครั้ง
        `;

        notFound.style.display =
            "block";


    } catch (error) {

        console.error(error);


        notFound.innerHTML = `
            ❌ เกิดข้อผิดพลาดในการค้นหา
            <br>
            กรุณาลองใหม่อีกครั้ง
        `;

        notFound.style.display =
            "block";

    }


    finally {

        loading.style.display =
            "none";

        button.disabled =
            false;

        button.textContent =
            "🔍 ตรวจสอบ";

    }

}


/* =====================================================
   แสดงแจ้งปัญหา
===================================================== */

function showReport(report) {

    document
        .getElementById("type")
        .textContent =
            "🚨 แจ้งปัญหา";


    document
        .getElementById("ticket")
        .textContent =
            report.ticket_number;


    document
        .getElementById("details")
        .innerHTML = `

        <div class="info">

            📌 <b>หัวข้อ:</b>
            ${escapeHtml(
                report.title
            )}

        </div>


        <div class="info">

            📂 <b>ประเภท:</b>
            ${escapeHtml(
                report.category
            )}

        </div>


        <div class="info">

            📍 <b>สถานที่:</b>
            ${escapeHtml(
                report.location
            )}

        </div>


        <div class="info">

            📝 <b>รายละเอียด:</b>
            <br>

            ${escapeHtml(
                report.description || "-"
            )}

        </div>

    `;


    showStatus(
        report.status
    );

}


/* =====================================================
   แสดงของหาย / พบของ
===================================================== */

function showLostFound(item) {

    const isLost =
        item.type === "ของหาย";


    document
        .getElementById("type")
        .textContent =
            isLost
            ? "🔴 ของหาย"
            : "🟢 พบของ";


    document
        .getElementById("ticket")
        .textContent =
            item.ticket_number;


    document
        .getElementById("details")
        .innerHTML = `

        <div class="info">

            📦 <b>สิ่งของ:</b>
            ${escapeHtml(
                item.item
            )}

        </div>


        <div class="info">

            📍 <b>สถานที่:</b>
            ${escapeHtml(
                item.location
            )}

        </div>


        <div class="info">

            📝 <b>รายละเอียด:</b>
            <br>

            ${escapeHtml(
                item.description || "-"
            )}

        </div>

    `;


    /* =================================================
       สำคัญ:
       ถ้าเจ้าของรับของแล้ว
       ให้แสดง "เจ้าของมารับแล้ว"
       ไม่ว่าค่า status จะเป็นอะไร
    ================================================= */

    if (
        item.is_claimed === true
    ) {

        showClaimedStatus();

        return;

    }


    showStatus(
        item.status
    );

}


/* =====================================================
   แสดงสถานะทั่วไป
===================================================== */

function showStatus(status) {

    const statusElement =
        document.getElementById(
            "status"
        );


    const statusClass =
        status || "pending";


    const statusText = {

        pending:
            "🟡 รอตรวจสอบ",

        in_progress:
            "🔵 กำลังดำเนินการ",

        resolved:
            "🟢 ดำเนินการเรียบร้อย"

    };


    statusElement.className =
        "status " +
        statusClass;


    statusElement.textContent =
        statusText[statusClass] ||
        "📌 " + statusClass;


    document
        .getElementById("result")
        .classList.add("show");

}


/* =====================================================
   เจ้าของมารับของแล้ว
===================================================== */

function showClaimedStatus() {

    const statusElement =
        document.getElementById(
            "status"
        );


    statusElement.className =
        "status claimed";


    statusElement.textContent =
        "✅ เจ้าของมารับของแล้ว";


    document
        .getElementById("result")
        .classList.add("show");

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   ENTER
===================================================== */

document
    .getElementById(
        "ticketInput"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                searchTicket();

            }

        }
    );


</script>

</body>

</html>
