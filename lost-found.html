<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ของหาย / พบของ | BEN2 BINCARE</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f8ff;
    color: #24324a;
}

/* =========================
   HEADER
========================= */

header {
    background: linear-gradient(135deg, #1769c2, #3184d8);
    color: white;
    padding: 22px 20px;
    box-shadow: 0 4px 15px rgba(23,105,194,.18);
}

.logo {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: .5px;
}

header div:last-child {
    margin-top: 3px;
    color: #fff4bd;
    font-weight: bold;
}

/* =========================
   CONTAINER
========================= */

.container {
    max-width: 700px;
    margin: auto;
    padding: 25px 18px 40px;
}

/* =========================
   BACK
========================= */

.back {
    display: inline-block;
    margin-bottom: 15px;
    color: #1769c2;
    text-decoration: none;
    font-weight: bold;
}

.back:hover {
    color: #0f55a0;
}

/* =========================
   CARD
========================= */

.card {
    background: white;
    border-radius: 22px;
    padding: 28px;
    box-shadow: 0 5px 18px rgba(31,76,135,.09);
    border: 1px solid #e2ebf8;
}

/* =========================
   TITLE
========================= */

h1 {
    margin-bottom: 8px;
    color: #1769c2;
}

.subtitle {
    color: #64748b;
    margin-bottom: 25px;
    line-height: 1.6;
}

/* =========================
   FORM
========================= */

label {
    display: block;
    font-weight: bold;
    margin-top: 18px;
    margin-bottom: 7px;
    color: #334765;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd8e8;
    border-radius: 11px;
    font-size: 16px;
    font-family: inherit;
    color: #24324a;
    background: #fbfdff;
    outline: none;
    transition: .2s;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #3184d8;
    box-shadow: 0 0 0 3px rgba(49,132,216,.12);
    background: white;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

/* =========================
   SUBMIT BUTTON
========================= */

button {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #f6c945;
    color: #24324a;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(246,201,69,.22);
    transition: .2s;
}

button:hover {
    background: #f3bd22;
    transform: translateY(-1px);
}

button:disabled {
    background: #cbd5e1;
    color: #64748b;
    cursor: not-allowed;
    transform: none;
}

/* =========================
   MESSAGE
========================= */

.message {
    display: none;
    margin-top: 20px;
    padding: 16px;
    border-radius: 12px;
    line-height: 1.6;
}

.success {
    background: #e8f7ed;
    color: #187044;
    border: 1px solid #bce8cb;
}

.error {
    background: #fff0f0;
    color: #b42323;
    border: 1px solid #f4c4c4;
}

/* =========================
   TICKET
========================= */

.ticket {
    font-size: 24px;
    font-weight: bold;
    margin-top: 10px;
    color: #1769c2;
    background: #eef5ff;
    padding: 10px 13px;
    border-radius: 10px;
    display: inline-block;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    header {
        padding: 19px 17px;
    }

    .logo {
        font-size: 25px;
    }

    .container {
        padding: 20px 14px 35px;
    }

    .card {
        padding: 22px;
    }

}

</style>

</head>


<body>


<header>

<div class="logo">
BEN2 BINCARE
</div>

<div>
📦 ระบบของหาย / พบของภายในโรงเรียน
</div>

</header>


<div class="container">


<a
href="index.html"
class="back">

← กลับหน้าหลัก

</a>


<div class="card">


<h1>
📦 ของหาย / พบของ
</h1>


<p class="subtitle">

แจ้งของที่หาย หรือแจ้งสิ่งของที่พบ
ภายในโรงเรียน เพื่อให้เจ้าของสามารถติดตามได้

</p>


<form id="lostFoundForm">


<label for="type">
ประเภทการแจ้ง
</label>


<select
id="type"
required>

<option value="">
-- เลือกประเภท --
</option>

<option value="ของหาย">
🔴 ของหาย
</option>

<option value="พบของ">
🟢 พบของ
</option>

</select>


<label for="item">
ชื่อสิ่งของ
</label>


<input
id="item"
type="text"
placeholder="เช่น กระเป๋าสตางค์สีดำ"
required
>


<label for="location">
สถานที่
</label>


<input
id="location"
type="text"
placeholder="เช่น อาคาร 2 ชั้น 3"
required
>


<label for="description">
รายละเอียด
</label>


<textarea
id="description"
placeholder="ระบุรายละเอียดของสิ่งของ เช่น สี ยี่ห้อ หรือลักษณะเด่น..."
></textarea>


<button
id="submitButton"
type="submit">

📦 ส่งแจ้งข้อมูล

</button>


</form>


<div
id="successMessage"
class="message success">

<strong>
✅ ส่งข้อมูลสำเร็จ!
</strong>

<div>
กรุณาเก็บหมายเลขนี้ไว้สำหรับติดตามรายการ
</div>

<div
id="ticketNumber"
class="ticket">
</div>

</div>


<div
id="errorMessage"
class="message error">

<strong>
❌ ไม่สามารถส่งข้อมูลได้
</strong>

<div id="errorText"></div>

</div>


</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://pbjeyvupzbhxodlibjuh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_paiTf1uzpiCAPR1oWQMlDg_PfVzT2p6";


/* =========================
   สร้างเลขรายการ
========================= */

function generateTicket() {

    const number =
        Math.floor(
            100000 +
            Math.random() * 900000
        );

    return "LOST-" + number;
}


/* =========================
   ส่งข้อมูล
========================= */

document
    .getElementById("lostFoundForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const button =
                document.getElementById(
                    "submitButton"
                );


            const successMessage =
                document.getElementById(
                    "successMessage"
                );


            const errorMessage =
                document.getElementById(
                    "errorMessage"
                );


            const errorText =
                document.getElementById(
                    "errorText"
                );


            button.disabled = true;

            button.textContent =
                "กำลังส่งข้อมูล...";


            successMessage.style.display =
                "none";

            errorMessage.style.display =
                "none";


            const ticket =
                generateTicket();


            const data = {

                ticket_number:
                    ticket,

                type:
                    document.getElementById(
                        "type"
                    ).value,

                item:
                    document.getElementById(
                        "item"
                    ).value,

                location:
                    document.getElementById(
                        "location"
                    ).value,

                description:
                    document.getElementById(
                        "description"
                    ).value

            };


            try {

                const response =
                    await fetch(
                        SUPABASE_URL +
                        "/rest/v1/lost_found",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    "Bearer " +
                                    SUPABASE_KEY,

                                "Prefer":
                                    "return=minimal"

                            },

                            body:
                                JSON.stringify(data)

                        }
                    );


                if (!response.ok) {

                    const error =
                        await response.text();

                    throw new Error(error);

                }


                document
                    .getElementById(
                        "ticketNumber"
                    )
                    .textContent =
                    ticket;


                successMessage.style.display =
                    "block";


                document
                    .getElementById(
                        "lostFoundForm"
                    )
                    .reset();


            }

            catch (error) {

                console.error(error);


                errorText.textContent =
                    "กรุณาลองใหม่อีกครั้ง";


                errorMessage.style.display =
                    "block";

            }


            button.disabled = false;

            button.textContent =
                "📦 ส่งแจ้งข้อมูล";

        }
    );

</script>

</body>

</html>
