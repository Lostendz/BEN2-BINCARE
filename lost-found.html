<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ของหาย / พบของ | BEN2 BINCARE</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            color: #1f2937;
        }

        header {
            background: #166534;
            color: white;
            padding: 20px;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 25px 18px;
        }

        .back {
            display: inline-block;
            margin-bottom: 15px;
            color: #166534;
            text-decoration: none;
            font-weight: bold;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #16a34a;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #9ca3af;
        }

        .message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .ticket {
            font-size: 24px;
            font-weight: bold;
            margin-top: 8px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">BINCARE</div>
    <div>ระบบของหาย / พบของภายในโรงเรียน</div>
</header>

<div class="container">

    <a href="index.html" class="back">
        ← กลับหน้าหลัก
    </a>

    <div class="card">

        <h1>📦 ของหาย / พบของ</h1>

        <p class="subtitle">
            แจ้งของที่หาย หรือแจ้งสิ่งของที่พบภายในโรงเรียน
        </p>

        <form id="lostFoundForm">

            <label for="type">
                ประเภทการแจ้ง
            </label>

            <select id="type" required>
                <option value="">-- เลือกประเภท --</option>
                <option value="ของหาย">🔴 ของหาย</option>
                <option value="พบของ">🟢 พบของ</option>
            </select>

            <label for="item">
                ชื่อสิ่งของ
            </label>

            <input
                id="item"
                type="text"
                placeholder="เช่น กระเป๋าสตางค์สีดำ"
                required
            >

            <label for="location">
                สถานที่
            </label>

            <input
                id="location"
                type="text"
                placeholder="เช่น อาคาร 2 ชั้น 3"
                required
            >

            <label for="description">
                รายละเอียด
            </label>

            <textarea
                id="description"
                placeholder="ระบุรายละเอียดของสิ่งของ..."
            ></textarea>

            <button
                id="submitButton"
                type="submit">
                📦 ส่งแจ้งข้อมูล
            </button>

        </form>

        <div id="successMessage" class="message success">

            <strong>✅ ส่งข้อมูลสำเร็จ!</strong>

            <div>
                กรุณาเก็บหมายเลขนี้ไว้สำหรับติดตามรายการ
            </div>

            <div
                id="ticketNumber"
                class="ticket">
            </div>

        </div>

        <div id="errorMessage" class="message error">

            <strong>❌ ไม่สามารถส่งข้อมูลได้</strong>

            <div id="errorText"></div>

        </div>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://pbjeyvupzbhxodlibjuh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_paiTf1uzpiCAPR1oWQMlDg_PfVzT2p6";


function generateTicket() {

    const number =
        Math.floor(
            100000 +
            Math.random() * 900000
        );

    return "LOST-" + number;
}


document
    .getElementById("lostFoundForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const button =
            document.getElementById("submitButton");

        const successMessage =
            document.getElementById("successMessage");

        const errorMessage =
            document.getElementById("errorMessage");

        const errorText =
            document.getElementById("errorText");

        button.disabled = true;
        button.textContent =
            "กำลังส่งข้อมูล...";

        successMessage.style.display = "none";
        errorMessage.style.display = "none";


        const ticket =
            generateTicket();


        const data = {

            ticket_number:
                ticket,

            type:
                document.getElementById("type").value,

            item:
                document.getElementById("item").value,

            location:
                document.getElementById("location").value,

            description:
                document.getElementById("description").value

        };


        try {

            const response =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/lost_found",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY,

                            "Prefer":
                                "return=minimal"

                        },

                        body:
                            JSON.stringify(data)

                    }
                );


            if (!response.ok) {

                const error =
                    await response.text();

                throw new Error(error);

            }


            document
                .getElementById("ticketNumber")
                .textContent =
                ticket;


            successMessage.style.display =
                "block";


            document
                .getElementById("lostFoundForm")
                .reset();


        } catch (error) {

            console.error(error);

            errorText.textContent =
                "กรุณาลองใหม่อีกครั้ง";

            errorMessage.style.display =
                "block";

        }


        button.disabled = false;

        button.textContent =
            "📦 ส่งแจ้งข้อมูล";

    });

</script>

</body>
</html>
