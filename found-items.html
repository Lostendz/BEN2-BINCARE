<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ของที่พบ | BEN2 BINCARE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

/* =========================
   THEME — เหมือน index.html
========================= */

:root {

    --blue: #0759d7;
    --blue-dark: #123b8f;
    --blue-light: #e8f1ff;

    --yellow: #ffd21f;
    --yellow-light: #fff9d6;

    --text: #172554;
    --muted: #64748b;

    --bg: #f4f8ff;
    --white: #ffffff;

    --border: #dbeafe;
}

/* =========================
   BODY
========================= */

body {

    font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

    background: #f4f8ff;

    color: var(--text);

    min-height: 100vh;
}

/* =========================
   HEADER
========================= */

header {

    background:
        linear-gradient(
            135deg,
            #0759d7,
            #1687ff
        );

    color: white;

    padding: 18px 20px;

    box-shadow:
        0 4px 18px rgba(7, 89, 215, .25);

    border-bottom: 5px solid #ffd21f;
}

.logo {

    font-size: 26px;

    font-weight: bold;

    letter-spacing: .5px;
}

header div:last-child {

    margin-top: 3px;

    color: #fff4a8;

    font-weight: bold;
}

/* =========================
   CONTAINER
========================= */

.container {

    max-width: 900px;

    margin: auto;

    padding: 35px 18px 50px;
}

/* =========================
   BACK
========================= */

.back {

    display: inline-flex;

    align-items: center;

    gap: 5px;

    margin-bottom: 18px;

    color: #0759d7;

    text-decoration: none;

    font-weight: bold;

    background: white;

    padding: 10px 14px;

    border-radius: 10px;

    box-shadow:
        0 3px 10px rgba(30,64,175,.08);

    transition: .2s;
}

.back:hover {

    transform: translateX(-3px);

    background: var(--yellow-light);
}

/* =========================
   HERO
========================= */

.hero {

    background: white;

    border-radius: 24px;

    padding: 30px;

    margin-bottom: 25px;

    border: 2px solid var(--border);

    box-shadow:
        0 12px 35px rgba(30,64,175,.10);

    position: relative;

    overflow: hidden;
}

.hero::before {

    content: "";

    position: absolute;

    width: 100px;

    height: 100px;

    background: var(--yellow-light);

    border-radius: 50%;

    right: -35px;

    top: -35px;

    opacity: .9;
}

.hero h1 {

    margin: 0 0 10px;

    color: var(--blue-dark);

    position: relative;
}

.hero p {

    color: var(--muted);

    line-height: 1.7;

    position: relative;
}

/* =========================
   REPORT BUTTON
========================= */

.report-button {

    display: inline-block;

    margin-top: 16px;

    background:
        linear-gradient(
            135deg,
            #ffd21f,
            #f6b900
        );

    color: var(--text);

    padding: 12px 18px;

    border-radius: 11px;

    text-decoration: none;

    font-weight: bold;

    transition: .2s;

    box-shadow:
        0 5px 14px rgba(246,201,69,.25);

    position: relative;
}

.report-button:hover {

    background:
        linear-gradient(
            135deg,
            #f6c000,
            #e6a900
        );

    transform: translateY(-2px);
}

/* =========================
   LIVE
========================= */

.live {

    display: inline-block;

    margin-top: 14px;

    font-size: 14px;

    color: #0759d7;

    font-weight: bold;
}

/* =========================
   LIST
========================= */

.list {

    display: grid;

    gap: 16px;
}

/* =========================
   ITEM
========================= */

.item {

    background: white;

    border-radius: 18px;

    padding: 21px;

    box-shadow:
        0 8px 25px rgba(30,64,175,.08);

    border: 2px solid var(--border);

    transition: .2s;
}

.item:hover {

    transform: translateY(-3px);

    border-color: #b8d5ff;

    box-shadow:
        0 10px 25px rgba(30,64,175,.12);
}

/* =========================
   BADGE
========================= */

.badge {

    display: inline-block;

    padding: 7px 12px;

    border-radius: 20px;

    background: var(--yellow-light);

    color: #765900;

    font-weight: bold;

    font-size: 14px;

    margin-bottom: 10px;

    border: 1px solid #ffe066;
}

/* =========================
   TITLE
========================= */

.item h2 {

    margin: 5px 0 12px;

    color: var(--blue-dark);
}

/* =========================
   INFO
========================= */

.info {

    margin: 8px 0;

    line-height: 1.6;

    color: var(--muted);
}

.info b {

    color: var(--blue-dark);
}

/* =========================
   TICKET
========================= */

.ticket {

    margin-top: 15px;

    padding-top: 13px;

    border-top: 1px solid var(--border);

    color: #0759d7;

    font-weight: bold;
}

/* =========================
   CLAIM BUTTON
========================= */

.claim-button {

    width: 100%;

    margin-top: 18px;

    border: none;

    border-radius: 11px;

    padding: 13px 16px;

    background:
        linear-gradient(
            135deg,
            #ffd21f,
            #f6b900
        );

    color: var(--text);

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;

    box-shadow:
        0 5px 14px rgba(246,201,69,.22);
}

.claim-button:hover {

    background:
        linear-gradient(
            135deg,
            #f6c000,
            #e6a900
        );

    transform: translateY(-2px);
}

.claim-button:disabled {

    background: #cbd5e1;

    color: #64748b;

    cursor: not-allowed;

    transform: none;

    box-shadow: none;
}

/* =========================
   EMPTY
========================= */

.empty {

    background: white;

    padding: 38px;

    border-radius: 18px;

    text-align: center;

    color: var(--muted);

    border: 2px solid var(--border);

    box-shadow:
        0 8px 25px rgba(30,64,175,.06);
}

/* =========================
   LOADING
========================= */

.loading {

    text-align: center;

    padding: 35px;

    color: var(--muted);
}

/* =========================
   MESSAGE
========================= */

.message {

    display: none;

    padding: 14px 16px;

    border-radius: 12px;

    margin-bottom: 15px;

    font-weight: bold;
}

.message.success {

    display: block;

    background: #e8f7ed;

    color: #187044;

    border: 2px solid #bce8cb;
}

.message.error {

    display: block;

    background: #fff1f2;

    color: #9f1239;

    border: 2px solid #fb7185;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    header {

        padding: 19px 17px;
    }

    .logo {

        font-size: 25px;
    }

    .container {

        padding: 20px 14px 35px;
    }

    .hero {

        padding: 22px;

        border-radius: 20px;
    }

    .item {

        padding: 18px;
    }

}

</style>

</head>

<body>

<header>

<div class="logo">
BEN2 BINCARE
</div>

<div>
📦 กระดานของหาย / พบของ
</div>

</header>


<div class="container">

<a href="index.html" class="back">
← กลับหน้าหลัก
</a>


<div class="hero">

<h1>
📦 ของที่พบในโรงเรียน
</h1>

<p>
มีคนพบสิ่งของภายในโรงเรียนและนำมาแจ้งไว้ที่นี่
เจ้าของสามารถตรวจสอบรายการด้านล่างได้
</p>

<a
href="lost-found.html"
class="report-button">
➕ แจ้งพบของ
</a>

<div class="live">
🟢 อัปเดตข้อมูลแบบ Real-time
</div>

</div>


<div
id="message"
class="message">
</div>


<div id="list" class="list">

<div class="loading">
กำลังโหลดรายการ...
</div>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://pbjeyvupzbhxodlibjuh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_paiTf1uzpiCAPR1oWQMlDg_PfVzT2p6";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   แสดงข้อความ
========================= */

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;

    setTimeout(() => {

        message.className =
            "message";

    }, 5000);

}


/* =========================
   โหลดรายการของที่พบ
========================= */

async function loadItems() {

    const container =
        document.getElementById("list");

    const {
        data,
        error
    } =
    await supabaseClient
        .from("lost_found")
        .select("*")
        .eq("type", "พบของ")
        .eq("is_claimed", false)
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "LOAD ERROR:",
            error
        );

        container.innerHTML = `
            <div class="empty">

                ❌ ไม่สามารถโหลดข้อมูลได้

                <br><br>

                ${escapeHtml(error.message)}

            </div>
        `;

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML = `
            <div class="empty">

                🎉 ตอนนี้ยังไม่มีของที่พบ

                <br><br>

                หากพบของ
                สามารถแจ้งไว้ที่นี่ได้

            </div>
        `;

        return;
    }


    container.innerHTML = "";


    data.forEach(item => {

        const card =
            document.createElement("div");

        card.className = "item";


        card.innerHTML = `

            <div class="badge">
                🟢 พบของ
            </div>

            <h2>
                📦 ${escapeHtml(item.item)}
            </h2>

            <div class="info">
                📍 <b>สถานที่พบ:</b>
                ${escapeHtml(item.location)}
            </div>

            <div class="info">
                📝 <b>รายละเอียด:</b><br>
                ${escapeHtml(
                    item.description || "-"
                )}
            </div>

            <div class="ticket">
                🎫 เลขรายการ:
                ${escapeHtml(item.ticket_number)}
            </div>

            <button
                class="claim-button"
                onclick="claimItem(${item.id}, this)">

                ✅ เจ้าของมารับแล้ว

            </button>

        `;


        container.appendChild(card);

    });

}


/* =========================
   เจ้าของมารับแล้ว
========================= */

async function claimItem(id, button) {

    const confirmed =
        confirm(
            "ยืนยันว่าของชิ้นนี้เจ้าของมารับไปแล้วใช่หรือไม่?"
        );


    if (!confirmed) {
        return;
    }


    button.disabled = true;

    button.textContent =
        "⏳ กำลังบันทึก...";


    try {

        const {
            data,
            error
        } =
        await supabaseClient
            .from("lost_found")
            .update({
                is_claimed: true
            })
            .eq("id", id)
            .select("id,is_claimed");


        console.log(
            "UPDATE DATA:",
            data
        );

        console.log(
            "UPDATE ERROR:",
            error
        );


        if (error) {

            console.error(
                "SUPABASE UPDATE ERROR:",
                error
            );

            button.disabled = false;

            button.textContent =
                "✅ เจ้าของมารับแล้ว";


            showMessage(
                "❌ บันทึกไม่ได้: " +
                error.message,
                "error"
            );

            return;
        }


        if (!data || data.length === 0) {

            console.error(
                "UPDATE สำเร็จแต่ไม่มีข้อมูลกลับมา"
            );

            button.disabled = false;

            button.textContent =
                "✅ เจ้าของมารับแล้ว";


            showMessage(
                "❌ ไม่มีสิทธิ์แก้ไขรายการนี้ หรือไม่พบรายการ",
                "error"
            );

            return;
        }


        showMessage(
            "✅ เจ้าของมารับแล้ว รายการถูกนำออกจากกระดาน",
            "success"
        );


        await loadItems();

    }

    catch (error) {

        console.error(
            "UNEXPECTED ERROR:",
            error
        );


        button.disabled = false;

        button.textContent =
            "✅ เจ้าของมารับแล้ว";


        showMessage(
            "❌ เกิดข้อผิดพลาด: " +
            error.message,
            "error"
        );

    }

}


/* =========================
   REAL-TIME
========================= */

const channel =
    supabaseClient
        .channel("lost-found-live")
        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "lost_found"
            },
            function(payload) {

                console.log(
                    "REAL-TIME:",
                    payload
                );

                loadItems();

            }
        )
        .subscribe();


/* =========================
   ป้องกัน HTML
========================= */

function escapeHtml(value) {

    if (!value) return "";

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================
   เริ่มต้น
========================= */

loadItems();

</script>

</body>

</html>
