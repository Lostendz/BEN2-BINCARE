<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ของที่พบ | BINCARE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f5;
    color: #1f2937;
}

header {
    background: #166534;
    color: white;
    padding: 20px;
}

.logo {
    font-size: 26px;
    font-weight: bold;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 25px 18px;
}

.back {
    display: inline-block;
    margin-bottom: 15px;
    color: #166534;
    text-decoration: none;
    font-weight: bold;
}

.hero {
    background: white;
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.hero h1 {
    margin-bottom: 8px;
}

.hero p {
    color: #6b7280;
    line-height: 1.6;
}

.report-button {
    display: inline-block;
    margin-top: 15px;
    background: #16a34a;
    color: white;
    padding: 12px 18px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
}

.list {
    display: grid;
    gap: 15px;
}

.item {
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 12px rgba(0,0,0,.07);
}

.badge {
    display: inline-block;
    padding: 6px 11px;
    border-radius: 20px;
    background: #dcfce7;
    color: #166534;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 10px;
}

.item h2 {
    margin: 5px 0 12px;
}

.info {
    margin: 8px 0;
    line-height: 1.5;
}

.ticket {
    margin-top: 15px;
    padding-top: 12px;
    border-top: 1px solid #e5e7eb;
    color: #166534;
    font-weight: bold;
}

.empty {
    background: white;
    padding: 35px;
    border-radius: 16px;
    text-align: center;
    color: #6b7280;
}

.loading {
    text-align: center;
    padding: 30px;
    color: #6b7280;
}

.live {
    display: inline-block;
    margin-top: 12px;
    font-size: 14px;
    color: #16a34a;
    font-weight: bold;
}

</style>

</head>

<body>

<header>

<div class="logo">
BINCARE
</div>

<div>
📦 กระดานของหาย / พบของ
</div>

</header>


<div class="container">

<a href="index.html" class="back">
← กลับหน้าหลัก
</a>


<div class="hero">

<h1>
📦 ของที่พบในโรงเรียน
</h1>

<p>
มีใครพบสิ่งของในโรงเรียนและนำมาแจ้งไว้ที่นี่
สามารถตรวจสอบรายการด้านล่างได้
</p>

<a
href="lost-found-report.html"
class="report-button">
➕ แจ้งพบของ
</a>

<div class="live">
🟢 อัปเดตข้อมูลแบบ Real-time
</div>

</div>


<div id="list" class="list">

<div class="loading">
กำลังโหลดรายการ...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://pbjeyvupzbhxodlibjuh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_paiTf1uzpiCAPR1oWQMlDg_PfVzT2p6";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   โหลดรายการของที่พบ
========================= */

async function loadItems() {

    const container =
        document.getElementById("list");


    const {
        data,
        error
    } =
    await supabaseClient
        .from("lost_found")
        .select("*")
        .eq("type", "พบของ")
        .eq("is_claimed", false)
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                ❌ ไม่สามารถโหลดข้อมูลได้
            </div>
        `;

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML = `
            <div class="empty">

                🎉 ตอนนี้ยังไม่มีของที่พบ
                <br><br>

                หากพบของ สามารถแจ้งไว้ที่นี่ได้

            </div>
        `;

        return;
    }


    container.innerHTML = "";


    data.forEach(item => {

        const card =
            document.createElement("div");

        card.className = "item";


        card.innerHTML = `

            <div class="badge">
                🟢 พบของ
            </div>

            <h2>
                📦 ${escapeHtml(item.item)}
            </h2>

            <div class="info">
                📍 <b>สถานที่พบ:</b>
                ${escapeHtml(item.location)}
            </div>

            <div class="info">
                📝 <b>รายละเอียด:</b><br>
                ${escapeHtml(
                    item.description || "-"
                )}
            </div>

            <div class="ticket">
                🎫 เลขรายการ:
                ${escapeHtml(item.ticket_number)}
            </div>

        `;


        container.appendChild(card);

    });

}


/* =========================
   Real-time
========================= */

supabaseClient
    .channel("lost-found-live")
    .on(
        "postgres_changes",
        {
            event: "*",
            schema: "public",
            table: "lost_found"
        },
        function(payload) {

            console.log(
                "ข้อมูลมีการเปลี่ยนแปลง",
                payload
            );

            loadItems();

        }
    )
    .subscribe();


/* =========================
   ป้องกัน HTML
========================= */

function escapeHtml(value) {

    if (!value) return "";

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================
   เริ่มต้น
========================= */

loadItems();

</script>

</body>

</html>
