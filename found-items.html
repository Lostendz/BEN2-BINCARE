<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ของที่พบ | BEN2 BINCARE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f5;
    color: #1f2937;
}

header {
    background: #166534;
    color: white;
    padding: 20px;
}

.logo {
    font-size: 26px;
    font-weight: bold;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 25px 18px;
}

.back {
    display: inline-block;
    margin-bottom: 15px;
    color: #166534;
    text-decoration: none;
    font-weight: bold;
}

.hero {
    background: white;
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.hero h1 {
    margin-bottom: 8px;
}

.hero p {
    color: #6b7280;
    line-height: 1.6;
}

.report-button {
    display: inline-block;
    margin-top: 15px;
    background: #16a34a;
    color: white;
    padding: 12px 18px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
}

.live {
    display: inline-block;
    margin-top: 12px;
    font-size: 14px;
    color: #16a34a;
    font-weight: bold;
}

.list {
    display: grid;
    gap: 15px;
}

.item {
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 12px rgba(0,0,0,.07);
}

.badge {
    display: inline-block;
    padding: 6px 11px;
    border-radius: 20px;
    background: #dcfce7;
    color: #166534;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 10px;
}

.item h2 {
    margin: 5px 0 12px;
}

.info {
    margin: 8px 0;
    line-height: 1.5;
}

.ticket {
    margin-top: 15px;
    padding-top: 12px;
    border-top: 1px solid #e5e7eb;
    color: #166534;
    font-weight: bold;
}

.claim-button {
    width: 100%;
    margin-top: 18px;
    border: none;
    border-radius: 10px;
    padding: 13px 16px;
    background: #16a34a;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.claim-button:hover {
    background: #15803d;
}

.claim-button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

.empty {
    background: white;
    padding: 35px;
    border-radius: 16px;
    text-align: center;
    color: #6b7280;
}

.loading {
    text-align: center;
    padding: 30px;
    color: #6b7280;
}

.message {
    display: none;
    padding: 13px;
    border-radius: 10px;
    margin-bottom: 15px;
    font-weight: bold;
}

.message.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.message.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

</style>

</head>

<body>

<header>

<div class="logo">
BINCARE
</div>

<div>
📦 กระดานของหาย / พบของ
</div>

</header>


<div class="container">

<a href="index.html" class="back">
← กลับหน้าหลัก
</a>


<div class="hero">

<h1>
📦 ของที่พบในโรงเรียน
</h1>

<p>
มีคนพบสิ่งของภายในโรงเรียนและนำมาแจ้งไว้ที่นี่
เจ้าของสามารถตรวจสอบรายการด้านล่างได้
</p>

<a
href="lost-found.html"
class="report-button">
➕ แจ้งพบของ
</a>

<div class="live">
🟢 อัปเดตข้อมูลแบบ Real-time
</div>

</div>


<div
id="message"
class="message">
</div>


<div id="list" class="list">

<div class="loading">
กำลังโหลดรายการ...
</div>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://pbjeyvupzbhxodlibjuh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_paiTf1uzpiCAPR1oWQMlDg_PfVzT2p6";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   แสดงข้อความ
========================= */

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;

    setTimeout(() => {

        message.className =
            "message";

    }, 5000);

}


/* =========================
   โหลดรายการของที่พบ
========================= */

async function loadItems() {

    const container =
        document.getElementById("list");

    const {
        data,
        error
    } =
    await supabaseClient
        .from("lost_found")
        .select("*")
        .eq("type", "พบของ")
        .eq("is_claimed", false)
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "LOAD ERROR:",
            error
        );

        container.innerHTML = `
            <div class="empty">

                ❌ ไม่สามารถโหลดข้อมูลได้

                <br><br>

                ${escapeHtml(error.message)}

            </div>
        `;

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML = `
            <div class="empty">

                🎉 ตอนนี้ยังไม่มีของที่พบ

                <br><br>

                หากพบของ
                สามารถแจ้งไว้ที่นี่ได้

            </div>
        `;

        return;
    }


    container.innerHTML = "";


    data.forEach(item => {

        const card =
            document.createElement("div");

        card.className = "item";


        card.innerHTML = `

            <div class="badge">
                🟢 พบของ
            </div>

            <h2>
                📦 ${escapeHtml(item.item)}
            </h2>

            <div class="info">
                📍 <b>สถานที่พบ:</b>
                ${escapeHtml(item.location)}
            </div>

            <div class="info">
                📝 <b>รายละเอียด:</b><br>
                ${escapeHtml(
                    item.description || "-"
                )}
            </div>

            <div class="ticket">
                🎫 เลขรายการ:
                ${escapeHtml(item.ticket_number)}
            </div>

            <button
                class="claim-button"
                onclick="claimItem(${item.id}, this)">

                ✅ เจ้าของมารับแล้ว

            </button>

        `;


        container.appendChild(card);

    });

}


/* =========================
   เจ้าของมารับแล้ว
========================= */

async function claimItem(id, button) {

    const confirmed =
        confirm(
            "ยืนยันว่าของชิ้นนี้เจ้าของมารับไปแล้วใช่หรือไม่?"
        );


    if (!confirmed) {
        return;
    }


    button.disabled = true;

    button.textContent =
        "⏳ กำลังบันทึก...";


    try {

        const {
            data,
            error
        } =
        await supabaseClient
            .from("lost_found")
            .update({
                is_claimed: true
            })
            .eq("id", id)
            .select("id,is_claimed");


        console.log(
            "UPDATE DATA:",
            data
        );

        console.log(
            "UPDATE ERROR:",
            error
        );


        /* =====================
           มี Error จาก Supabase
        ===================== */

        if (error) {

            console.error(
                "SUPABASE UPDATE ERROR:",
                error
            );

            button.disabled = false;

            button.textContent =
                "✅ เจ้าของมารับแล้ว";


            showMessage(
                "❌ บันทึกไม่ได้: " +
                error.message,
                "error"
            );

            return;
        }


        /* =====================
           UPDATE ไม่ได้ข้อมูล
        ===================== */

        if (!data || data.length === 0) {

            console.error(
                "UPDATE สำเร็จแต่ไม่มีข้อมูลกลับมา"
            );

            button.disabled = false;

            button.textContent =
                "✅ เจ้าของมารับแล้ว";


            showMessage(
                "❌ ไม่มีสิทธิ์แก้ไขรายการนี้ หรือไม่พบรายการ",
                "error"
            );

            return;
        }


        /* =====================
           สำเร็จ
        ===================== */

        console.log(
            "CLAIM SUCCESS:",
            data
        );


        showMessage(
            "✅ เจ้าของมารับแล้ว รายการถูกนำออกจากกระดาน",
            "success"
        );


        /* โหลดใหม่ */

        await loadItems();

    }

    catch (error) {

        console.error(
            "UNEXPECTED ERROR:",
            error
        );


        button.disabled = false;

        button.textContent =
            "✅ เจ้าของมารับแล้ว";


        showMessage(
            "❌ เกิดข้อผิดพลาด: " +
            error.message,
            "error"
        );

    }

}


/* =========================
   REAL-TIME
========================= */

const channel =
    supabaseClient
        .channel("lost-found-live")
        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "lost_found"
            },
            function(payload) {

                console.log(
                    "REAL-TIME:",
                    payload
                );

                loadItems();

            }
        )
        .subscribe();


/* =========================
   ป้องกัน HTML
========================= */

function escapeHtml(value) {

    if (!value) return "";

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================
   เริ่มต้น
========================= */

loadItems();

</script>

</body>

</html>
