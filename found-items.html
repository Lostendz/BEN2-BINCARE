<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ของที่พบ | BEN2 BINCARE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans Thai", sans-serif;
    background: linear-gradient(135deg, #eef6ff, #fff9db);
    color: #172554;
}

/* =========================
   HEADER
========================= */

header {
    background: linear-gradient(135deg, #075985, #2563eb);
    color: white;
    padding: 22px 20px;
    box-shadow: 0 5px 18px rgba(37, 99, 235, .25);
}

.logo {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: .5px;
}

header div:last-child {
    margin-top: 4px;
    color: #fef08a;
    font-weight: bold;
}

/* =========================
   CONTAINER
========================= */

.container {
    max-width: 900px;
    margin: auto;
    padding: 28px 18px 40px;
}

/* =========================
   BACK
========================= */

.back {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 18px;
    color: #1d4ed8;
    text-decoration: none;
    font-weight: 800;
    background: white;
    padding: 9px 14px;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(30,64,175,.08);
    transition: .2s;
}

.back:hover {
    transform: translateX(-3px);
    background: #eff6ff;
}

/* =========================
   HERO
========================= */

.hero {
    background: rgba(255,255,255,.96);
    border-radius: 24px;
    padding: 28px;
    margin-bottom: 20px;
    border: 2px solid #dbeafe;
    box-shadow: 0 12px 35px rgba(30,64,175,.12);
    position: relative;
    overflow: hidden;
}

.hero::before {
    content: "";
    position: absolute;
    width: 100px;
    height: 100px;
    background: #fff9db;
    border-radius: 50%;
    right: -35px;
    top: -35px;
    opacity: .9;
}

.hero h1 {
    margin: 0 0 8px;
    color: #1e3a8a;
    position: relative;
}

.hero p {
    color: #64748b;
    line-height: 1.6;
    position: relative;
}

/* =========================
   REPORT BUTTON
========================= */

.report-button {
    display: inline-block;
    margin-top: 15px;
    background: linear-gradient(135deg, #facc15, #f59e0b);
    color: #172554;
    padding: 12px 18px;
    border-radius: 11px;
    text-decoration: none;
    font-weight: 900;
    transition: .2s;
    box-shadow: 0 5px 14px rgba(245,158,11,.25);
    position: relative;
}

.report-button:hover {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    transform: translateY(-2px);
}

/* =========================
   LIVE
========================= */

.live {
    display: inline-block;
    margin-top: 14px;
    font-size: 14px;
    color: #1d4ed8;
    font-weight: bold;
}

/* =========================
   LIST
========================= */

.list {
    display: grid;
    gap: 16px;
}

/* =========================
   ITEM
========================= */

.item {
    background: rgba(255,255,255,.96);
    border-radius: 18px;
    padding: 21px;
    box-shadow: 0 8px 25px rgba(30,64,175,.08);
    border: 2px solid #dbeafe;
    transition: .2s;
}

.item:hover {
    transform: translateY(-3px);
    border-color: #93c5fd;
    box-shadow: 0 10px 25px rgba(30,64,175,.12);
}

/* =========================
   BADGE
========================= */

.badge {
    display: inline-block;
    padding: 7px 12px;
    border-radius: 20px;
    background: #fff9db;
    color: #713f12;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 10px;
    border: 1px solid #f0df9b;
}

/* =========================
   TITLE
========================= */

.item h2 {
    margin: 5px 0 12px;
    color: #1e3a8a;
}

/* =========================
   INFO
========================= */

.info {
    margin: 8px 0;
    line-height: 1.6;
    color: #64748b;
}

.info b {
    color: #1e3a8a;
}

/* =========================
   TICKET
========================= */

.ticket {
    margin-top: 15px;
    padding-top: 13px;
    border-top: 1px solid #dbeafe;
    color: #1d4ed8;
    font-weight: bold;
}

/* =========================
   CLAIM BUTTON
========================= */

.claim-button {
    width: 100%;
    margin-top: 18px;
    border: none;
    border-radius: 11px;
    padding: 13px 16px;
    background: linear-gradient(135deg, #facc15, #f59e0b);
    color: #172554;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    transition: .2s;
    box-shadow: 0 5px 14px rgba(245,158,11,.22);
}

.claim-button:hover {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    transform: translateY(-2px);
}

.claim-button:disabled {
    background: #cbd5e1;
    color: #64748b;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}

/* =========================
   EMPTY
========================= */

.empty {
    background: rgba(255,255,255,.96);
    padding: 38px;
    border-radius: 18px;
    text-align: center;
    color: #64748b;
    border: 2px solid #dbeafe;
    box-shadow: 0 8px 25px rgba(30,64,175,.06);
}

/* =========================
   LOADING
========================= */

.loading {
    text-align: center;
    padding: 35px;
    color: #64748b;
}

/* =========================
   MESSAGE
========================= */

.message {
    display: none;
    padding: 14px 16px;
    border-radius: 12px;
    margin-bottom: 15px;
    font-weight: bold;
}

.message.success {
    display: block;
    background: #ecfeff;
    color: #155e75;
    border: 2px solid #22d3ee;
}

.message.error {
    display: block;
    background: #fff1f2;
    color: #9f1239;
    border: 2px solid #fb7185;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    header {
        padding: 19px 17px;
    }

    .logo {
        font-size: 25px;
    }

    .container {
        padding: 20px 14px 35px;
    }

    .hero {
        padding: 22px;
        border-radius: 20px;
    }

    .item {
        padding: 18px;
    }

}

</style>

</head>

<body>

<header>

<div class="logo">
BEN2 BINCARE
</div>

<div>
📦 กระดานของหาย / พบของ
</div>

</header>


<div class="container">

<a href="index.html" class="back">
← กลับหน้าหลัก
</a>


<div class="hero">

<h1>
📦 ของที่พบในโรงเรียน
</h1>

<p>
มีคนพบสิ่งของภายในโรงเรียนและนำมาแจ้งไว้ที่นี่
เจ้าของสามารถตรวจสอบรายการด้านล่างได้
</p>

<a
href="lost-found.html"
class="report-button">
➕ แจ้งพบของ
</a>

<div class="live">
🟢 อัปเดตข้อมูลแบบ Real-time
</div>

</div>


<div
id="message"
class="message">
</div>


<div id="list" class="list">

<div class="loading">
กำลังโหลดรายการ...
</div>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://pbjeyvupzbhxodlibjuh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_paiTf1uzpiCAPR1oWQMlDg_PfVzT2p6";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   แสดงข้อความ
========================= */

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;

    setTimeout(() => {

        message.className =
            "message";

    }, 5000);

}


/* =========================
   โหลดรายการของที่พบ
========================= */

async function loadItems() {

    const container =
        document.getElementById("list");

    const {
        data,
        error
    } =
    await supabaseClient
        .from("lost_found")
        .select("*")
        .eq("type", "พบของ")
        .eq("is_claimed", false)
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "LOAD ERROR:",
            error
        );

        container.innerHTML = `
            <div class="empty">

                ❌ ไม่สามารถโหลดข้อมูลได้

                <br><br>

                ${escapeHtml(error.message)}

            </div>
        `;

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML = `
            <div class="empty">

                🎉 ตอนนี้ยังไม่มีของที่พบ

                <br><br>

                หากพบของ
                สามารถแจ้งไว้ที่นี่ได้

            </div>
        `;

        return;
    }


    container.innerHTML = "";


    data.forEach(item => {

        const card =
            document.createElement("div");

        card.className = "item";


        card.innerHTML = `

            <div class="badge">
                🟢 พบของ
            </div>

            <h2>
                📦 ${escapeHtml(item.item)}
            </h2>

            <div class="info">
                📍 <b>สถานที่พบ:</b>
                ${escapeHtml(item.location)}
            </div>

            <div class="info">
                📝 <b>รายละเอียด:</b><br>
                ${escapeHtml(
                    item.description || "-"
                )}
            </div>

            <div class="ticket">
                🎫 เลขรายการ:
                ${escapeHtml(item.ticket_number)}
            </div>

            <button
                class="claim-button"
                onclick="claimItem(${item.id}, this)">

                ✅ เจ้าของมารับแล้ว

            </button>

        `;


        container.appendChild(card);

    });

}


/* =========================
   เจ้าของมารับแล้ว
========================= */

async function claimItem(id, button) {

    const confirmed =
        confirm(
            "ยืนยันว่าของชิ้นนี้เจ้าของมารับไปแล้วใช่หรือไม่?"
        );


    if (!confirmed) {
        return;
    }


    button.disabled = true;

    button.textContent =
        "⏳ กำลังบันทึก...";


    try {

        const {
            data,
            error
        } =
        await supabaseClient
            .from("lost_found")
            .update({
                is_claimed: true
            })
            .eq("id", id)
            .select("id,is_claimed");


        console.log(
            "UPDATE DATA:",
            data
        );

        console.log(
            "UPDATE ERROR:",
            error
        );


        if (error) {

            console.error(
                "SUPABASE UPDATE ERROR:",
                error
            );

            button.disabled = false;

            button.textContent =
                "✅ เจ้าของมารับแล้ว";


            showMessage(
                "❌ บันทึกไม่ได้: " +
                error.message,
                "error"
            );

            return;
        }


        if (!data || data.length === 0) {

            console.error(
                "UPDATE สำเร็จแต่ไม่มีข้อมูลกลับมา"
            );

            button.disabled = false;

            button.textContent =
                "✅ เจ้าของมารับแล้ว";


            showMessage(
                "❌ ไม่มีสิทธิ์แก้ไขรายการนี้ หรือไม่พบรายการ",
                "error"
            );

            return;
        }


        showMessage(
            "✅ เจ้าของมารับแล้ว รายการถูกนำออกจากกระดาน",
            "success"
        );


        await loadItems();

    }

    catch (error) {

        console.error(
            "UNEXPECTED ERROR:",
            error
        );


        button.disabled = false;

        button.textContent =
            "✅ เจ้าของมารับแล้ว";


        showMessage(
            "❌ เกิดข้อผิดพลาด: " +
            error.message,
            "error"
        );

    }

}


/* =========================
   REAL-TIME
========================= */

const channel =
    supabaseClient
        .channel("lost-found-live")
        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "lost_found"
            },
            function(payload) {

                console.log(
                    "REAL-TIME:",
                    payload
                );

                loadItems();

            }
        )
        .subscribe();


/* =========================
   ป้องกัน HTML
========================= */

function escapeHtml(value) {

    if (!value) return "";

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================
   เริ่มต้น
========================= */

loadItems();

</script>

</body>

</html>
